<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="UpWell — functional drinks with a smart cap. Design preview.">
<meta name="theme-color" content="#C42E62">
<title>UpWell — Your box</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
body{margin:0;background:#FBF7F0}
a{color:#1C1414}a:hover{color:#C42E62}
.wrap{max-width:1280px;margin:0 auto;padding:0 28px}
.nav-links{display:flex;gap:34px}
@media (max-width:820px){.nav-links{display:none}}
.disp{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:0.005em;line-height:0.95}
.btn{font:inherit;cursor:pointer;border:none;border-radius:999px;padding:18px 26px;font-weight:700;font-size:16px;min-height:44px}
.opt{font:inherit;cursor:pointer;background:#FFFFFF;color:#1C1414;border-radius:18px;padding:18px;text-align:left;min-height:44px;width:100%}
.field{font:inherit;width:100%;box-sizing:border-box;padding:16px;border:1.5px solid #D8CEBF;border-radius:14px;background:#FFFFFF;font-size:16px;color:#1C1414}
.mnav{display:none}
.mnav>summary{list-style:none;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.mnav>summary::-webkit-details-marker{display:none}
.mnav-panel{position:fixed;left:0;right:0;top:78px;background:#FFFFFF;border-bottom:1px solid #EFE7DB;box-shadow:0 24px 40px rgba(28,20,20,0.14);padding:6px 20px 20px;display:flex;flex-direction:column;z-index:40}
.mnav-panel a{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:26px;line-height:1;color:#1C1414;text-decoration:none;padding:16px 0;border-bottom:1px solid #F0E9DF}
.mnav-panel a.mnav-cta{margin-top:14px;border:none;background:#C42E62;color:#FFFFFF;text-align:center;border-radius:999px;font-family:'Archivo',sans-serif;text-transform:none;font-weight:700;font-size:17px;padding:16px}
@media (max-width:820px){
.nav-links{display:none !important}
.mnav{display:block}
.signin-label{display:none}
.wrap{padding-left:18px !important;padding-right:18px !important}
h1.disp,h2.disp{font-size:clamp(34px,11vw,52px) !important}
h1.disp.m-hero-title{font-size:26px !important}
.m-kw{font-size:84px !important}
.m-title{font-size:32px !important;white-space:normal !important}
.m-deck{margin-right:26px !important;height:auto !important;width:76% !important;min-height:0 !important}
.m-chip{left:-10px !important;bottom:14px !important;max-width:230px !important}
.m-tabs{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
.m-pad{padding:26px !important}
}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="font-family:'Archivo',sans-serif;color:#1C1414;background:#FBF7F0;min-height:100vh;padding-bottom:72px">

<header style="position:sticky;top:0;z-index:20;background:rgba(255,255,255,0.97);backdrop-filter:blur(12px);border-bottom:1px solid #EFE7DB">
<div class="wrap" style="display:flex;align-items:center;justify-content:space-between;height:78px;gap:20px">
<div style="display:flex;align-items:center;gap:44px">
<a href="/" aria-label="UpWell home" style="display:flex;align-items:center;min-height:44px"><img src="/assets/31123edbeba1cd87a31fcf992a67861d.png" alt="UpWell" style="height:30px;width:auto;display:block"></a>
<nav class="nav-links" aria-label="Main">
<a href="/drinks" style="text-decoration:none;font-weight:500;font-size:17px;">Our drinks</a>
<a href="/#why" style="text-decoration:none;font-weight:500;font-size:17px;">Why UpWell</a>
<a href="/box" style="text-decoration:none;font-weight:500;font-size:17px;">Build your box</a>
<a href="/#ingredients" style="text-decoration:none;font-weight:500;font-size:17px;">Ingredients</a>
<a href="/contact" style="text-decoration:none;font-weight:500;font-size:17px;">Contact</a>
</nav>
</div>
<div style="display:flex;align-items:center;gap:10px">
<a href="/cart" aria-label="Cart" style="display:flex;width:44px;height:44px;align-items:center;justify-content:center"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#1C1414" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></svg></a>
<a href="#" aria-label="Sign in" style="display:flex;align-items:center;gap:8px;min-height:44px;text-decoration:none;font-weight:500;font-size:16px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C1414" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg><span class="signin-label">Sign in</span></a>
<details class="mnav"><summary aria-label="Menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C1414" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></summary><nav class="mnav-panel" aria-label="Mobile"><a href="/drinks">Our drinks</a><a href="/#why">Why UpWell</a><a href="/box">Build your box</a><a href="/#ingredients">Ingredients</a><a href="/contact">Contact</a><a href="/box" class="mnav-cta">Build your box →</a></nav></details>
</div>
</div>
</header>
<div class="wrap" style="display:flex;justify-content:flex-end;padding-top:20px"><div style="display:flex;gap:10px;align-items:center;font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase">
<span style="color:{{c1}}">Cart</span><span style="width:24px;height:2px;background:#D8CEBF"></span><span style="color:{{c2}}">Checkout</span><span style="width:24px;height:2px;background:#D8CEBF"></span><span style="color:{{c3}}">Done</span>
</div></div>

<sc-if value="{{isCart}}" hint-placeholder-val="{{true}}">
<section style="padding:56px 0">
<div class="wrap" style="display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start">
<div style="flex:999 1 560px;min-width:0">
<h1 class="disp" style="font-size:64px;margin:0 0 28px">Your box</h1>
<div style="background:#FFFFFF;border:1px solid #EAE2D6;border-radius:28px;padding:22px">
<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap">
<div><div style="font-size:12px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#C42E62">{{modeLabel}}</div><div class="disp" style="font-size:34px;margin-top:8px">UpWell {{boxName}}</div><div style="font-size:14px;color:#5B5150;margin-top:6px">{{boxLine}}</div></div>
<div style="text-align:right"><div class="disp" style="font-size:28px">{{total}}</div><div style="font-size:12px;color:#1F6E5A;font-weight:700">You save {{saved}}</div></div>
</div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px">
<sc-for list="{{items}}" as="i" hint-placeholder-count="3">
<div style="background:{{i.bg}};color:{{i.fg}};border-radius:20px;padding:10px 12px;display:flex;align-items:center;gap:8px">
<img src="{{i.img}}" alt="" style="height:78px;width:auto">
<div><div class="disp" style="font-size:26px">× {{i.qty}}</div><div style="font-size:12px;font-weight:700;margin-top:4px;line-height:1.2">{{i.name}}</div></div>
</div>
</sc-for>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px">
<a href="/box" style="font-weight:700;font-size:14px">Edit my box →</a>
<div role="group" aria-label="Purchase type" style="display:flex;background:#F3ECE1;border-radius:999px;padding:4px;gap:4px">
<button class="btn" type="button" onClick="{{pickSub}}" aria-pressed="{{subOn}}" style="padding:10px 16px;font-size:14px;background:{{subBg}};color:{{subFg}}">Subscribe &amp; save 5%</button>
<button class="btn" type="button" onClick="{{pickOnce}}" aria-pressed="{{onceOn}}" style="padding:10px 16px;font-size:14px;background:{{onceBg}};color:{{onceFg}}">One-time</button>
</div>
</div>
</div>
<sc-if value="{{notAdded}}" hint-placeholder-val="{{true}}">
<div style="margin-top:18px;background:#1C1414;color:#FBF7F0;border-radius:24px;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
<div><div style="font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#E9849F">Go further</div><div class="disp" style="font-size:24px;margin-top:6px">Upgrade to UpWell Legend</div><div style="font-size:14px;color:#BDB2AF;margin-top:4px">24 bottles saves {{legendDisc}}% instead of {{discTotal}}%. Your mix doubles.</div></div>
<button class="btn" type="button" onClick="{{add}}" style="background:#FBF7F0;color:#1C1414;padding:14px 22px">Upgrade</button>
</div>
</sc-if>
<sc-if value="{{added}}" hint-placeholder-val="{{false}}">
<div style="margin-top:18px;background:#FDE6E5;border-radius:20px;padding:16px 18px;font-weight:700;color:#6E4A52">Upgraded to Legend · your mix doubled to 24 bottles</div>
</sc-if>
</div>
<div style="flex:1 1 320px;min-width:0;background:#FFFFFF;border:1px solid #EAE2D6;border-radius:28px;padding:28px;display:flex;flex-direction:column;gap:14px;position:sticky;top:24px">
<div class="disp" style="font-size:28px;margin-bottom:4px">Summary</div>
<div style="display:flex;justify-content:space-between"><span style="color:#5B5150">Subtotal ({{boxSize}} × {{base}})</span><span>{{fullPrice}}</span></div>
<div style="display:flex;justify-content:space-between;color:#1F6E5A"><span>Box discount</span><span>−{{boxDisc}}%</span></div>
<sc-if value="{{isSub}}" hint-placeholder-val="{{true}}"><div style="display:flex;justify-content:space-between;color:#1F6E5A"><span>Subscribe &amp; save</span><span>−5%</span></div></sc-if>
<div style="display:flex;justify-content:space-between"><span style="color:#5B5150">Delivery</span><span style="font-weight:700;color:{{delColor}}">{{delivery}}</span></div>
<div style="display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #EAE2D6;padding-top:14px"><span class="disp" style="font-size:24px">Total</span><span class="disp" style="font-size:32px">{{total}}</span></div>
<div style="font-size:11.5px;color:#8A7F7C">Sample prices for the prototype</div>
<button class="btn" type="button" onClick="{{toCheckout}}" style="background:#C42E62;color:#FFFFFF;margin-top:8px">Secure checkout</button>
<div style="display:flex;justify-content:center;gap:14px;font-size:13px;color:#5B5150"><span>Whish</span><span>·</span><span>Cash on delivery</span></div>
<div style="background:#F3ECE1;border-radius:14px;padding:12px 14px;font-size:13px;color:#5B5150;line-height:1.5">{{sideNote}}</div>
</div>
</div>
</section>
</sc-if>

<sc-if value="{{isCheckout}}" hint-placeholder-val="{{false}}">
<section style="padding:56px 0">
<div class="wrap" style="display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start">
<div style="flex:999 1 540px;min-width:0;display:flex;flex-direction:column;gap:22px">
<div style="font-size:12px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#8A7F7C">Shopify checkout · your logo and colours only</div>
<h1 class="disp" style="font-size:56px;margin:0">Checkout</h1>
<div>
<label for="phone" style="display:block;font-weight:700;font-size:14px;margin-bottom:8px">Phone number <span style="color:#C42E62">· required</span></label>
<input id="phone" class="field" type="tel" placeholder="+961 70 000 000">

</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px">
<div><label for="name" style="display:block;font-weight:700;font-size:14px;margin-bottom:8px">Full name</label><input id="name" class="field" type="text"></div>
<div><label for="area" style="display:block;font-weight:700;font-size:14px;margin-bottom:8px">City / area</label><input id="area" class="field" type="text" placeholder="e.g. Dbayeh"></div>
</div>
<div><label for="addr" style="display:block;font-weight:700;font-size:14px;margin-bottom:8px">Street, building, floor</label><input id="addr" class="field" type="text"></div>
<div>
<div style="font-weight:700;font-size:14px;margin-bottom:10px">Payment</div>
<div style="display:flex;flex-direction:column;gap:10px">
<button class="opt" type="button" onClick="{{payWhish}}" style="border:2px solid {{whishBorder}}">
<span style="display:flex;align-items:center;gap:14px"><span style="width:22px;height:22px;border-radius:50%;border:2px solid {{whishBorder}};display:flex;align-items:center;justify-content:center;flex:0 0 auto"><span style="width:11px;height:11px;border-radius:50%;background:{{whishDot}}"></span></span><span><span style="display:block;font-weight:700;font-size:17px">Whish Pay</span><span style="display:block;font-size:14px;color:#5B5150;margin-top:2px">Your Whish number and a one-time code</span></span></span>
</button>
<button class="opt" type="button" onClick="{{payCod}}" style="border:2px solid {{codBorder}}">
<span style="display:flex;align-items:center;gap:14px"><span style="width:22px;height:22px;border-radius:50%;border:2px solid {{codBorder}};display:flex;align-items:center;justify-content:center;flex:0 0 auto"><span style="width:11px;height:11px;border-radius:50%;background:{{codDot}}"></span></span><span><span style="display:block;font-weight:700;font-size:17px">Cash on delivery</span><span style="display:block;font-size:14px;color:#5B5150;margin-top:2px">Pay the driver at your door</span></span></span>
</button>
</div>
</div>
<sc-if value="{{isCod}}" hint-placeholder-val="{{false}}">
<div style="background:#FDE6E5;color:#5A1F33;border-radius:16px;padding:16px 18px;font-size:14px;line-height:1.55;display:flex;gap:12px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C42E62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span><b>Payment instructions:</b> pay the driver in cash. On a subscription, we confirm each delivery with you 2–3 days ahead.</span></div>
</sc-if>
<button class="btn" type="button" onClick="{{place}}" style="background:#C42E62;color:#FFFFFF">Place order</button>
<button class="btn" type="button" onClick="{{back}}" style="background:transparent;color:#5B5150;padding:10px">← Back to cart</button>
</div>
<div style="flex:1 1 300px;min-width:0;background:#FFFFFF;border:1px solid #EAE2D6;border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:14px">
<div><div class="disp" style="font-size:24px">UpWell {{boxName}}</div><div style="font-size:13px;color:#5B5150;margin-top:4px">{{boxLine}}</div></div>
<sc-for list="{{items}}" as="i" hint-placeholder-count="3"><div style="display:flex;gap:12px;align-items:center"><img src="{{i.img}}" alt="" style="height:56px;border-radius:8px;background:{{i.bg}}"><div style="flex:1;font-weight:700;font-size:14px">{{i.name}}</div><div style="font-weight:700">× {{i.qty}}</div></div></sc-for>
<div style="display:flex;justify-content:space-between;border-top:1px solid #EAE2D6;padding-top:14px"><span class="disp" style="font-size:22px">Total</span><span class="disp" style="font-size:26px">{{total}}</span></div>
</div>
</div>
</section>
</sc-if>

<sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
<section style="padding:72px 0">
<div class="wrap" style="max-width:860px">
<div style="text-align:center">
<div style="width:72px;height:72px;border-radius:50%;background:#C42E62;margin:0 auto 24px;display:flex;align-items:center;justify-content:center">
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg>
</div>
<h1 class="disp" style="font-size:80px;margin:0 0 14px">Twist. Tap. Shake. Glow.</h1>
<p style="color:#5B5150;font-size:18px;margin:0 0 8px">Your box is on its way.</p>
<p style="color:#8A7F7C;font-size:15px;margin:0 0 32px">{{payLine}}</p>
</div>
<sc-if value="{{isSub}}" hint-placeholder-val="{{true}}">
<div class="disp" style="font-size:26px;margin-bottom:12px">How your subscription works</div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:left;margin:0 0 36px">
<div style="background:#FFFFFF;border:1px solid #EAE2D6;border-radius:18px;padding:16px"><div class="disp" style="font-size:22px;color:#C42E62">2–3 days before</div><div style="font-size:14px;color:#5B5150;margin-top:6px;line-height:1.45">We message you on WhatsApp and in the app with your next box.</div></div>
<div style="background:#FFFFFF;border:1px solid #EAE2D6;border-radius:18px;padding:16px"><div class="disp" style="font-size:22px;color:#C42E62">You confirm</div><div style="font-size:14px;color:#5B5150;margin-top:6px;line-height:1.45">Or skip, pause or change your mix. Nothing ships without your OK.</div></div>
<div style="background:#FFFFFF;border:1px solid #EAE2D6;border-radius:18px;padding:16px"><div class="disp" style="font-size:22px;color:#C42E62">Pay your way</div><div style="font-size:14px;color:#5B5150;margin-top:6px;line-height:1.45">By Whish request, or cash to the driver at your door.</div></div>
</div>
</sc-if>
<div style="background:#1C1414;color:#FBF7F0;border-radius:36px;padding:44px;display:flex;flex-wrap:wrap;gap:36px;align-items:center">
<div style="width:160px;height:160px;background:#FBF7F0;border-radius:20px;flex:0 0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:16px;box-sizing:border-box" aria-label="QR code placeholder">
<div style="background:#1C1414;border-radius:3px"></div><div style="background:#1C1414;border-radius:3px"></div><div></div><div style="background:#1C1414;border-radius:3px"></div><div style="background:#1C1414;border-radius:3px"></div>
<div style="background:#1C1414;border-radius:3px"></div><div></div><div style="background:#C42E62;border-radius:3px"></div><div></div><div style="background:#1C1414;border-radius:3px"></div>
<div></div><div style="background:#C42E62;border-radius:3px"></div><div style="background:#1C1414;border-radius:3px"></div><div style="background:#C42E62;border-radius:3px"></div><div></div>
<div style="background:#1C1414;border-radius:3px"></div><div></div><div style="background:#C42E62;border-radius:3px"></div><div></div><div style="background:#1C1414;border-radius:3px"></div>
<div style="background:#1C1414;border-radius:3px"></div><div style="background:#1C1414;border-radius:3px"></div><div></div><div style="background:#1C1414;border-radius:3px"></div><div style="background:#1C1414;border-radius:3px"></div>
</div>
<div style="flex:1 1 300px;min-width:0">
<div style="font-size:13px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#E9849F;margin-bottom:10px">Next step</div>
<div class="disp" style="font-size:44px;margin-bottom:12px">Get the UpWell app</div>
<div style="color:#BDB2AF;font-size:16px;line-height:1.6;margin-bottom:24px">Log your first bottle tomorrow, check in on how you feel, and manage deliveries. Sign in with the same phone number — your order is already there.</div>
<div style="display:flex;gap:12px;flex-wrap:wrap">
<a href="#" style="background:#FBF7F0;color:#1C1414;text-decoration:none;font-weight:700;padding:14px 22px;border-radius:14px">App Store</a>
<a href="#" style="background:#FBF7F0;color:#1C1414;text-decoration:none;font-weight:700;padding:14px 22px;border-radius:14px">Google Play</a>
</div>
</div>
</div>
<div style="text-align:center"><button class="btn" type="button" onClick="{{restart}}" style="background:transparent;color:#8A7F7C;margin-top:24px">Restart prototype</button></div>
</div>
</section>
</sc-if>
</div>
</template>
<script id="dc-logic" type="text/x-dc" data-props='{"basePrice":{"editor":"number","default":3},"$preview":{"width":1440,"height":1900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { step: 'cart', pay: 'whish', added: false, buy: 'sub' };
}
renderVals() {
const s = this.state;
const on = '#C42E62', off = '#EAE2D6';
const act = '#1C1414', idle = '#B5AAA7';
const m = s.added ? 2 : 1;
const items = [
{ name: 'Collagen + Creatine', qty: 6 * m, img: '/assets/1e312cf70451d331518596eb690219f9.webp', bg: '#FDE6E5', fg: '#1C1414' },
{ name: 'Coconut Matcha', qty: 4 * m, img: '/assets/5d6a6bf7d30273993f2a59b1dade3aa2.webp', bg: '#D2E0B4', fg: '#12302A' },
{ name: 'Chocolate Clear Whey', qty: 2 * m, img: '/assets/df1379f946c6783678c913de3b1653e9.webp', bg: '#120504', fg: '#FBF7F0' }
];
const isSub = s.buy === 'sub';
const base = Number(this.props.basePrice ?? 3);
const DISC = { 12: 10, 24: 15 };
const size = s.added ? 24 : 12;
const boxDisc = DISC[size];
const discTotal = boxDisc + (isSub ? 5 : 0);
const fullP = base * size, totP = fullP * (1 - discTotal / 100);
const money = (v) => '$' + v.toFixed(2);
return {
isSub, boxDisc, discTotal, legendDisc: DISC[24] + (isSub ? 5 : 0), base: money(base), fullPrice: money(fullP), total: money(totP), saved: money(fullP - totP),
modeLabel: isSub ? 'Subscription box' : 'One-time box',
boxLine: size + ' bottles · ' + (isSub ? 'every 4 weeks · free delivery' : 'delivered once'),
delivery: isSub ? 'Free' : 'Calculated at checkout', delColor: isSub ? '#1F6E5A' : '#1C1414',
sideNote: isSub ? 'No automatic charges: we message you 2–3 days before each delivery to confirm, then you pay by Whish or cash. Skip or pause anytime.' : 'One-time order, no subscription. Switch to subscribe & save for an extra 5% and free delivery.',
subOn: isSub ? 'true' : 'false', onceOn: isSub ? 'false' : 'true',
subBg: isSub ? '#1C1414' : 'transparent', subFg: isSub ? '#FBF7F0' : '#1C1414', onceBg: !isSub ? '#1C1414' : 'transparent', onceFg: !isSub ? '#FBF7F0' : '#1C1414',
pickSub: () => this.setState({ buy: 'sub' }), pickOnce: () => this.setState({ buy: 'once' }),
items, boxName: s.added ? 'Legend' : 'Insider', boxSize: s.added ? 24 : 12,
isCart: s.step === 'cart', isCheckout: s.step === 'checkout', isDone: s.step === 'done',
c1: s.step === 'cart' ? act : idle, c2: s.step === 'checkout' ? act : idle, c3: s.step === 'done' ? act : idle,
added: s.added, notAdded: !s.added,
isCod: s.pay === 'cod',
whishBorder: s.pay === 'whish' ? on : off, codBorder: s.pay === 'cod' ? on : off,
whishDot: s.pay === 'whish' ? on : 'transparent', codDot: s.pay === 'cod' ? on : 'transparent',
payLine: s.pay === 'cod' ? 'Cash on delivery · pay the driver at your door' : (isSub ? 'Paid with Whish · we’ll message you before your next box' : 'Paid with Whish · one-time order'),
add: () => this.setState({ added: true }),
toCheckout: () => this.setState({ step: 'checkout' }),
back: () => this.setState({ step: 'cart' }),
place: () => this.setState({ step: 'done' }),
restart: () => this.setState({ step: 'cart', pay: 'whish', added: false, buy: 'sub' }),
payWhish: () => this.setState({ pay: 'whish' }),
payCod: () => this.setState({ pay: 'cod' })
};
}
}
</script>
<script src="/js/morphdom.min.js"></script>
<script src="/js/runtime.js"></script>
</body>
