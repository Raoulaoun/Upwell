<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="UpWell — functional drinks with a smart cap. Design preview.">
<meta name="theme-color" content="#C42E62">
<title>UpWell — Your box</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<script>(function(){var m=location.search.match(/view=(desktop|mobile)/);try{if(m)sessionStorage.setItem('uw-view',m[1]);var p=sessionStorage.getItem('uw-view');}catch(e){}var small=window.matchMedia('(max-width: 760px)').matches;var want=p?p==='mobile':small;if(want!==true){location.replace('/cart'+location.hash);}})();</script>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
body{margin:0;background:#FBF7F0}
a{color:#1C1414}a:hover{color:#C42E62}
.disp{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:0.005em;line-height:0.95}
.mono{font-family:'IBM Plex Mono',monospace;font-weight:600;text-transform:uppercase;letter-spacing:0.04em}
.b{font:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
.field{font:inherit;width:100%;box-sizing:border-box;padding:15px;border:1.5px solid #D8CEBF;border-radius:14px;background:#FFFFFF;font-size:16px;color:#1C1414}
.lbl{display:block;font-weight:700;font-size:13.5px;margin-bottom:6px}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="font-family:'Archivo',sans-serif;color:#1C1414;background:#FBF7F0;min-height:100vh;max-width:520px;margin:0 auto;padding-bottom:150px">

<header style="position:sticky;top:0;z-index:30;background:rgba(255,255,255,0.97);border-bottom:1px solid #EFE7DB">
<div style="display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 20px">
<button class="b" type="button" onClick="{{back}}" aria-label="Back" style="width:44px;height:44px;display:flex;align-items:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C1414" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
<img src="/assets/31123edbeba1cd87a31fcf992a67861d.png" alt="UpWell" style="height:22px;width:auto">
<span style="width:44px"></span>
</div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:0 20px 10px">
<sc-for list="{{stepper}}" as="x" hint-placeholder-count="3"><span style="display:flex;flex-direction:column;gap:5px"><span style="height:4px;border-radius:2px;background:{{x.bar}}"></span><span style="font-size:11px;font-weight:700;color:{{x.c}}">{{x.label}}</span></span></sc-for>
</div>
</header>

<sc-if value="{{isCart}}" hint-placeholder-val="{{true}}">
<div style="padding:20px">
<h1 class="disp" style="font-size:42px;margin:0 0 16px">Your box</h1>
<div style="background:#FFFFFF;border:1px solid #EAE2D6;border-radius:22px;padding:16px">
<div class="mono" style="font-size:10.5px;color:#C42E62">{{modeLabel}}</div>
<div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:6px"><span class="disp" style="font-size:28px">UpWell {{boxName}}</span><span class="disp" style="font-size:24px">{{total}}</span></div>
<div style="font-size:13px;color:#5B5150;margin-top:4px">{{boxLine}}</div>
<div style="display:flex;flex-direction:column;gap:8px;margin-top:14px">
<sc-for list="{{items}}" as="i" hint-placeholder-count="3"><div style="display:flex;align-items:center;gap:10px;background:{{i.bg}};color:{{i.fg}};border-radius:14px;padding:6px 12px 6px 6px"><img src="{{i.img}}" alt="" style="height:56px;width:auto"><span style="flex:1;font-weight:700;font-size:14px">{{i.name}}</span><span class="disp" style="font-size:22px">× {{i.qty}}</span></div></sc-for>
</div>
<a href="/m/box" style="display:inline-block;margin-top:12px;font-weight:700;font-size:14px;min-height:32px">Edit my box →</a>
<div role="group" aria-label="Purchase type" style="display:grid;grid-template-columns:1fr 1fr;background:#F3ECE1;border-radius:999px;padding:4px;margin-top:8px">
<button class="b" type="button" onClick="{{pickSub}}" aria-pressed="{{subOn}}" style="border-radius:999px;min-height:44px;font-weight:700;font-size:13px;background:{{subBg}};color:{{subFg}}">Subscribe −5%</button>
<button class="b" type="button" onClick="{{pickOnce}}" aria-pressed="{{onceOn}}" style="border-radius:999px;min-height:44px;font-weight:700;font-size:13px;background:{{onceBg}};color:{{onceFg}}">One-time</button>
</div>
</div>
<sc-if value="{{notAdded}}" hint-placeholder-val="{{true}}">
<div style="margin-top:12px;background:#1C1414;color:#FBF7F0;border-radius:20px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px"><div><div class="disp" style="font-size:20px">Go Legend</div><div style="font-size:12.5px;color:#BDB2AF;margin-top:4px">24 bottles saves {{legendDisc}}%.</div></div><button class="b" type="button" onClick="{{add}}" style="background:#FBF7F0;color:#1C1414;border-radius:999px;padding:0 18px;min-height:44px;font-weight:700">Upgrade</button></div>
</sc-if>
<div style="background:#FFFFFF;border:1px solid #EAE2D6;border-radius:22px;padding:16px;margin-top:12px;display:flex;flex-direction:column;gap:8px;font-size:14px">
<div style="display:flex;justify-content:space-between"><span style="color:#5B5150">Subtotal ({{boxSize}} × {{base}})</span><span>{{fullPrice}}</span></div>
<div style="display:flex;justify-content:space-between;color:#1F6E5A"><span>Box discount</span><span>−{{boxDisc}}%</span></div>
<sc-if value="{{isSub}}" hint-placeholder-val="{{true}}"><div style="display:flex;justify-content:space-between;color:#1F6E5A"><span>Subscribe &amp; save</span><span>−5%</span></div></sc-if>
<div style="display:flex;justify-content:space-between"><span style="color:#5B5150">Delivery</span><span style="font-weight:700">{{delivery}}</span></div>
<div style="display:flex;justify-content:space-between;font-weight:700;color:#1F6E5A"><span>You save</span><span>{{saved}}</span></div>
<div style="font-size:11px;color:#8A7F7C">Sample prices for the prototype</div>
</div>
</div>
</sc-if>

<sc-if value="{{isCheckout}}" hint-placeholder-val="{{false}}">
<div style="padding:20px;display:flex;flex-direction:column;gap:16px">
<h1 class="disp" style="font-size:42px;margin:0">Checkout</h1>
<div><label for="mphone" class="lbl">Phone number <span style="color:#C42E62">· required</span></label><input id="mphone" class="field" type="tel" inputmode="tel" placeholder="+961 70 000 000"></div>
<div><label for="mname" class="lbl">Full name</label><input id="mname" class="field" type="text" autocomplete="name"></div>
<div><label for="marea" class="lbl">City / area</label><input id="marea" class="field" type="text" placeholder="e.g. Dbayeh"></div>
<div><label for="maddr" class="lbl">Street, building, floor</label><input id="maddr" class="field" type="text"></div>
<div>
<div class="lbl">Payment</div>
<div style="display:flex;flex-direction:column;gap:8px">
<button class="b" type="button" onClick="{{payWhish}}" aria-pressed="{{whishOn}}" style="text-align:left;background:#FFFFFF;border:2px solid {{whishBorder}};border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center"><span style="width:20px;height:20px;border-radius:50%;border:2px solid {{whishBorder}};display:flex;align-items:center;justify-content:center;flex:0 0 auto"><span style="width:10px;height:10px;border-radius:50%;background:{{whishDot}}"></span></span><span><span style="display:block;font-weight:700;font-size:16px">Whish Pay</span><span style="display:block;font-size:12.5px;color:#5B5150;margin-top:2px">{{whishNote}}</span></span></button>
<button class="b" type="button" onClick="{{payCod}}" aria-pressed="{{codOn}}" style="text-align:left;background:#FFFFFF;border:2px solid {{codBorder}};border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center"><span style="width:20px;height:20px;border-radius:50%;border:2px solid {{codBorder}};display:flex;align-items:center;justify-content:center;flex:0 0 auto"><span style="width:10px;height:10px;border-radius:50%;background:{{codDot}}"></span></span><span><span style="display:block;font-weight:700;font-size:16px">Cash on delivery</span><span style="display:block;font-size:12.5px;color:#5B5150;margin-top:2px">Pay the driver at your door</span></span></button>
</div>
</div>
<sc-if value="{{isCod}}" hint-placeholder-val="{{false}}"><div style="background:#FDE6E5;color:#5A1F33;border-radius:14px;padding:14px;font-size:13px;line-height:1.5"><b>Payment instructions:</b> pay the driver in cash. On a subscription, we confirm each delivery with you 2–3 days ahead.</div></sc-if>
</div>
</sc-if>

<sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
<div style="padding:32px 20px;text-align:center">
<div style="width:64px;height:64px;border-radius:50%;background:#C42E62;margin:0 auto 18px;display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L19 7"/></svg></div>
<h1 class="disp" style="font-size:44px;margin:0 0 10px">Twist. Tap. Shake. Glow.</h1>
<p style="color:#5B5150;font-size:16px;margin:0 0 6px">Your box is on its way.</p>
<p style="color:#8A7F7C;font-size:13.5px;margin:0 0 28px">{{payLine}}</p>
<sc-if value="{{isSub}}" hint-placeholder-val="{{true}}"><div style="text-align:left;margin-bottom:22px"><div class="disp" style="font-size:22px;margin-bottom:10px">How your subscription works</div><div style="display:flex;flex-direction:column;gap:8px"><div style="background:#FFFFFF;border:1px solid #EAE2D6;border-radius:14px;padding:12px;font-size:13.5px;line-height:1.45"><b style="color:#C42E62">2–3 days before:</b> we message you on WhatsApp and in the app.</div><div style="background:#FFFFFF;border:1px solid #EAE2D6;border-radius:14px;padding:12px;font-size:13.5px;line-height:1.45"><b style="color:#C42E62">You confirm,</b> skip or change your mix. Nothing ships without your OK.</div><div style="background:#FFFFFF;border:1px solid #EAE2D6;border-radius:14px;padding:12px;font-size:13.5px;line-height:1.45"><b style="color:#C42E62">Pay your way:</b> Whish request or cash at your door.</div></div></div></sc-if>
<div style="background:#1C1414;color:#FBF7F0;border-radius:26px;padding:24px;text-align:left">
<div class="mono" style="font-size:10.5px;color:#E9849F;margin-bottom:8px">Next step</div>
<div class="disp" style="font-size:30px;margin-bottom:10px">Get the UpWell app</div>
<div style="color:#BDB2AF;font-size:14px;line-height:1.55;margin-bottom:18px">Log your first bottle, check in on how you feel and manage deliveries. Sign in with the same phone number.</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><a href="#" style="background:#FBF7F0;color:#1C1414;text-decoration:none;font-weight:700;padding:14px 8px;border-radius:12px;text-align:center;font-size:13px">App Store</a><a href="#" style="background:#FBF7F0;color:#1C1414;text-decoration:none;font-weight:700;padding:14px 8px;border-radius:12px;text-align:center;font-size:13px">Google Play</a></div>
</div>
<button class="b" type="button" onClick="{{restart}}" style="color:#8A7F7C;font-weight:700;margin-top:20px;min-height:44px">Restart prototype</button>
</div>
</sc-if>

<sc-if value="{{notDone}}" hint-placeholder-val="{{true}}">
<div style="position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center">
<div style="width:100%;max-width:520px;background:#FFFFFF;border-top:1px solid #EAE2D6;border-radius:22px 22px 0 0;box-shadow:0 -14px 40px rgba(28,20,20,0.1);padding:12px 16px 16px;box-sizing:border-box">
<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px"><span class="disp" style="font-size:22px">Total</span><span><span class="disp" style="font-size:28px">{{total}}</span> <span style="font-size:12px;color:#5B5150">{{totalNote}}</span></span></div>
<button class="b" type="button" onClick="{{primary}}" style="width:100%;background:#C42E62;color:#FFFFFF;font-weight:700;font-size:16px;padding:16px;border-radius:999px;min-height:52px">{{primaryLabel}}</button>
<div style="text-align:center;font-size:12px;color:#5B5150;margin-top:8px">Whish · Cash on delivery</div>
</div>
</div>
</sc-if>
</div>
</template>
<script id="dc-logic" type="text/x-dc" data-props='{"basePrice":{"editor":"number","default":3},"$preview":{"width":390,"height":1400}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { step: 'cart', pay: 'whish', added: false, buy: 'sub' };
}
renderVals() {
const s = this.state;
const isSub = s.buy === 'sub';
const base = Number(this.props.basePrice ?? 3);
const DISC = { 12: 10, 24: 15 };
const size = s.added ? 24 : 12;
const m = s.added ? 2 : 1;
const discTotal = DISC[size] + (isSub ? 5 : 0);
const fullP = base * size, totP = fullP * (1 - discTotal / 100);
const money = (v) => '$' + v.toFixed(2);
const on = '#C42E62', off = '#EAE2D6';
const items = [
{ name: 'Collagen + Creatine', qty: 6 * m, img: '/assets/1e312cf70451d331518596eb690219f9.webp', bg: '#FDE6E5', fg: '#1C1414' },
{ name: 'Coconut Matcha', qty: 4 * m, img: '/assets/5d6a6bf7d30273993f2a59b1dade3aa2.webp', bg: '#E3EFDA', fg: '#12302A' },
{ name: 'Chocolate Clear Whey', qty: 2 * m, img: '/assets/df1379f946c6783678c913de3b1653e9.webp', bg: '#120504', fg: '#FBF7F0' }
];
const idx = ['cart', 'checkout', 'done'].indexOf(s.step);
const stepper = ['Cart', 'Checkout', 'Done'].map((label, i) => ({ label, bar: i <= idx ? '#C42E62' : '#EAE2D6', c: i <= idx ? '#1C1414' : '#B5AAA7' }));
return {
items, stepper, boxName: s.added ? 'Legend' : 'Insider', boxSize: size,
isCart: s.step === 'cart', isCheckout: s.step === 'checkout', isDone: s.step === 'done', notDone: s.step !== 'done',
added: s.added, notAdded: !s.added, isSub, legendDisc: DISC[24] + (isSub ? 5 : 0), boxDisc: DISC[size],
base: money(base), fullPrice: money(fullP), total: money(totP), saved: money(fullP - totP),
modeLabel: isSub ? 'Subscription box' : 'One-time box',
boxLine: size + ' bottles · ' + (isSub ? 'every 4 weeks · free delivery' : 'delivered once'),
totalNote: isSub ? '/ 4 weeks' : 'one time', delivery: isSub ? 'Free' : 'At checkout',
subOn: isSub ? 'true' : 'false', onceOn: isSub ? 'false' : 'true',
subBg: isSub ? '#1C1414' : 'transparent', subFg: isSub ? '#FBF7F0' : '#1C1414', onceBg: !isSub ? '#1C1414' : 'transparent', onceFg: !isSub ? '#FBF7F0' : '#1C1414',
pickSub: () => this.setState({ buy: 'sub' }), pickOnce: () => this.setState({ buy: 'once' }),
isCod: s.pay === 'cod', whishOn: s.pay === 'whish' ? 'true' : 'false', codOn: s.pay === 'cod' ? 'true' : 'false',
whishBorder: s.pay === 'whish' ? on : off, codBorder: s.pay === 'cod' ? on : off,
whishDot: s.pay === 'whish' ? on : 'transparent', codDot: s.pay === 'cod' ? on : 'transparent',
whishNote: 'Your Whish number and a one-time code',
payLine: s.pay === 'cod' ? 'Cash on delivery · pay the driver at your door' : (isSub ? 'Paid with Whish · we’ll message you before your next box' : 'Paid with Whish · one-time order'),
primaryLabel: s.step === 'cart' ? 'Secure checkout' : 'Place order',
primary: () => this.setState({ step: s.step === 'cart' ? 'checkout' : 'done' }),
back: () => this.setState({ step: 'cart' }),
add: () => this.setState({ added: true }),
payWhish: () => this.setState({ pay: 'whish' }), payCod: () => this.setState({ pay: 'cod' }),
restart: () => this.setState({ step: 'cart', pay: 'whish', added: false, buy: 'sub' })
};
}
}
</script>
<script src="/js/morphdom.min.js"></script>
<script src="/js/runtime.js"></script>
</body>
</html>
