<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="UpWell — functional drinks with a smart cap. Design preview.">
<meta name="theme-color" content="#C42E62">
<title>UpWell — The drinks</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<script>(function(){var m=location.search.match(/view=(desktop|mobile)/);try{if(m)sessionStorage.setItem('uw-view',m[1]);var p=sessionStorage.getItem('uw-view');}catch(e){}var small=window.matchMedia('(max-width: 760px)').matches;var want=p?p==='mobile':small;if(want!==true){location.replace('/product'+location.hash);}})();</script>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
body{margin:0;background:#FBF7F0}
a{color:#1C1414}a:hover{color:#C42E62}
.disp{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:0.005em;line-height:0.95}
.mono{font-family:'IBM Plex Mono',monospace;font-weight:600;text-transform:uppercase;letter-spacing:0.04em}
.b{font:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 20px}
.row::-webkit-scrollbar{display:none}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.drawer{transition:transform .35s cubic-bezier(.2,.7,.2,1)}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="font-family:'Archivo',sans-serif;color:#1C1414;background:#FBF7F0;min-height:100vh;max-width:520px;margin:0 auto;overflow-x:clip;padding-bottom:96px">

<header style="position:sticky;top:0;z-index:30;background:rgba(255,255,255,0.97);backdrop-filter:blur(12px);border-bottom:1px solid #EFE7DB">
<div class="px" style="display:flex;align-items:center;justify-content:space-between;height:60px">
<button class="b" type="button" onClick="{{openMenu}}" aria-label="Open menu" style="width:44px;height:44px;display:flex;align-items:center;justify-content:flex-start"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C1414" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
<a href="/m/" aria-label="UpWell home" style="display:flex;align-items:center;min-height:44px"><img src="/assets/31123edbeba1cd87a31fcf992a67861d.png" alt="UpWell" style="height:22px;width:auto;display:block"></a>
<a href="/m/cart" aria-label="Cart, 1 box" style="width:44px;height:44px;display:flex;align-items:center;justify-content:flex-end;position:relative"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#1C1414" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></svg><span style="position:absolute;top:5px;right:-3px;width:17px;height:17px;border-radius:50%;background:#C42E62;color:#FFFFFF;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center">1</span></a>
</div>
</header>

<sc-if value="{{menu}}" hint-placeholder-val="{{false}}">
<div style="position:fixed;inset:0;z-index:50;display:flex">
<div class="drawer" style="width:84%;max-width:380px;background:#FFFFFF;height:100%;box-sizing:border-box;padding:18px 22px 28px;display:flex;flex-direction:column;gap:6px;box-shadow:20px 0 60px rgba(0,0,0,0.25);overflow-y:auto">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><img src="/assets/31123edbeba1cd87a31fcf992a67861d.png" alt="UpWell" style="height:22px;width:auto"><button class="b" type="button" onClick="{{closeMenu}}" aria-label="Close menu" style="width:44px;height:44px;display:flex;align-items:center;justify-content:flex-end"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C1414" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<a href="/m/box" style="background:#C42E62;color:#FFFFFF;text-decoration:none;border-radius:18px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:17px">Build your box <span>→</span></a>
<sc-for list="{{menuDrinks}}" as="d" hint-placeholder-count="4"><a href="/m/product" style="text-decoration:none;display:flex;align-items:center;gap:12px;padding:8px 4px;border-bottom:1px solid #F0E9DF"><img src="{{d.cut}}" alt="" style="height:52px;width:auto"><span><span class="mono" style="display:block;font-size:10px;color:{{d.color}}">{{d.key}}</span><span style="display:block;font-weight:600;font-size:16px;margin-top:3px">{{d.name}}</span></span></a></sc-for>
<sc-for list="{{menuLinks}}" as="l" hint-placeholder-count="5"><a href="{{l.href}}" onClick="{{closeMenu}}" class="disp" style="text-decoration:none;font-size:30px;padding:10px 4px;border-bottom:1px solid #F0E9DF">{{l.label}}</a></sc-for>
<div style="margin-top:auto;padding-top:18px;display:flex;gap:10px;font-size:14px;color:#5B5150"><span>Sign in</span><span>·</span><span>WhatsApp us</span></div>
</div>
<button class="b" type="button" onClick="{{closeMenu}}" aria-label="Close menu" style="flex:1;background:rgba(28,20,20,0.45)"></button>
</div>
</sc-if>

<div class="row" style="padding-top:12px;padding-bottom:12px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4"><button class="b" type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="flex:0 0 auto;border-radius:999px;padding:0 14px;min-height:42px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px;background:{{t.bg}};color:{{t.fg}};border:1.5px solid {{t.border}}"><span style="width:9px;height:9px;border-radius:50%;background:{{t.dot}}"></span>{{t.name}}</button></sc-for>
</div>

<div style="padding:0 20px">
<div style="position:relative;aspect-ratio:1 / 1;border-radius:24px;overflow:hidden;background:{{p.bg}}">
<sc-for list="{{gal}}" as="g" hint-placeholder-count="3"><img src="{{g.img}}" alt="{{g.alt}}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{g.pos}};opacity:{{g.op}};transition:opacity .5s"></sc-for>
<button class="b" type="button" onClick="{{prev}}" aria-label="Previous image" style="position:absolute;left:10px;top:50%;margin-top:-22px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;font-size:18px">←</button>
<button class="b" type="button" onClick="{{next}}" aria-label="Next image" style="position:absolute;right:10px;top:50%;margin-top:-22px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;font-size:18px">→</button>
<div style="position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:6px"><sc-for list="{{dots}}" as="d" hint-placeholder-count="3"><span style="width:{{d.w}};height:7px;border-radius:4px;background:#FFFFFF;opacity:{{d.op}};transition:all .3s"></span></sc-for></div>
</div>
</div>

<div style="padding:20px 20px 0">
<div class="mono" style="font-size:11px;color:{{p.color}};margin-bottom:8px">{{p.moment}}</div>
<h1 class="disp" style="font-size:46px;margin:0 0 10px">{{p.name}}</h1>
<p style="font-size:19px;line-height:1.35;font-weight:600;margin:0 0 10px">{{p.emotion}}</p>
<p style="font-size:15px;line-height:1.55;color:#5B5150;margin:0 0 14px">{{p.desc}}</p>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px"><sc-for list="{{p.facts}}" as="f" hint-placeholder-count="4"><span style="background:{{p.tint}};border-radius:999px;padding:7px 11px;font-weight:700;font-size:12px">{{f}}</span></sc-for></div>

<div style="background:#FFFFFF;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;border:1px solid #EAE2D6">
<div role="group" aria-label="Purchase type" style="display:grid;grid-template-columns:1fr 1fr;background:#F3ECE1;border-radius:999px;padding:4px">
<button class="b" type="button" onClick="{{pickSub}}" aria-pressed="{{subOn}}" style="border-radius:999px;min-height:44px;font-weight:700;font-size:13.5px;background:{{subBg}};color:{{subFg}}">Subscribe &amp; save</button>
<button class="b" type="button" onClick="{{pickOnce}}" aria-pressed="{{onceOn}}" style="border-radius:999px;min-height:44px;font-weight:700;font-size:13.5px;background:{{onceBg}};color:{{onceFg}}">One-time</button>
</div>
<sc-for list="{{tiers}}" as="t" hint-placeholder-count="3">
<button class="b" type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="text-align:left;border-radius:16px;padding:12px 14px;border:2px solid {{t.border}};background:{{t.bg}};display:flex;align-items:center;gap:12px;min-height:56px">
<span style="width:20px;height:20px;border-radius:50%;border:2px solid {{t.border}};display:flex;align-items:center;justify-content:center;flex:0 0 auto"><span style="width:10px;height:10px;border-radius:50%;background:{{t.dot}}"></span></span>
<span style="flex:1"><span style="display:block;font-weight:700;font-size:15px">{{t.name}} · {{t.size}} bottles</span><span style="display:block;font-size:12px;color:#5B5150;margin-top:2px">{{t.per}} per bottle</span></span>
<span style="font-size:11px;font-weight:700;background:{{p.tint}};color:{{p.color}};padding:5px 9px;border-radius:999px">−{{t.disc}}%</span>
</button>
</sc-for>
<div style="font-size:12.5px;color:#5B5150;line-height:1.5">{{buyNote}}</div>
<div style="font-size:11px;color:#8A7F7C">Sample prices · to be confirmed</div>
</div>
</div>

<section style="background:#1C1414;color:#FBF7F0;padding:40px 20px;margin-top:36px">
<h2 class="disp" style="font-size:38px;margin:0 0 18px">Twist. Tap. Shake. Glow.</h2>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
<sc-for list="{{steps}}" as="x" hint-placeholder-count="4"><div style="background:{{x.bg}};border-radius:16px;padding:14px"><div class="disp" style="font-size:24px;color:{{x.c}}">{{x.n}} {{x.t}}</div><div style="font-size:12.5px;color:{{x.tc}};margin-top:6px;line-height:1.45">{{x.d}}</div></div></sc-for>
</div>
</section>

<section style="padding:36px 20px 0">
<div class="mono" style="font-size:11px;color:{{p.color}};margin-bottom:10px">What's inside</div>
<h2 class="disp" style="font-size:38px;margin:0 0 10px">Short label. Real doses.</h2>
<sc-for list="{{p.ingredients}}" as="i" hint-placeholder-count="3"><details style="border-bottom:1px solid #EAE2D6;padding:14px 0"><summary style="display:flex;justify-content:space-between;gap:12px;font-weight:700;font-size:16px;min-height:28px;align-items:center"><span>{{i.name}}</span><span style="color:{{p.color}}">{{i.dose}}</span></summary><p style="color:#5B5150;line-height:1.55;font-size:14.5px;margin:8px 0 0">{{i.note}}</p></details></sc-for>
<p style="font-size:12px;color:#8A7F7C;margin:12px 0 16px">Full label: {{p.extras}} · 230 ml</p>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
<div style="border-radius:16px;overflow:hidden;aspect-ratio:1 / 1;position:relative"><img src="{{p.ing}}" alt="{{p.ingAlt}}" style="width:100%;height:100%;object-fit:cover;display:block"><span style="position:absolute;left:8px;bottom:8px;background:rgba(255,255,255,0.92);font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:999px">{{p.ingAlt}}</span></div>
<div style="border-radius:16px;overflow:hidden;aspect-ratio:1 / 1"><img src="{{p.life}}" alt="{{p.name}} lifestyle" style="width:100%;height:100%;object-fit:cover;object-position:{{p.lifePos}};display:block"></div>
</div>
</section>

<section style="padding:36px 0 20px">
<div style="display:flex;justify-content:space-between;align-items:baseline;padding:0 20px;margin-bottom:12px"><h2 class="disp" style="font-size:30px;margin:0">Complete your box</h2><a href="/m/box" style="font-weight:700;font-size:13px">Build →</a></div>
<div class="row">
<sc-for list="{{others}}" as="o" hint-placeholder-count="3"><button class="b" type="button" onClick="{{o.pick}}" style="flex:0 0 auto;width:150px;text-align:left;background:{{o.bg}};color:{{o.fg}};border-radius:20px;overflow:hidden;display:flex;flex-direction:column"><span style="display:flex;justify-content:center;padding-top:10px"><img src="{{o.bottle}}" alt="" style="height:140px;width:auto"></span><span style="padding:10px 12px 14px"><span class="disp" style="display:block;font-size:17px">{{o.name}}</span><span style="display:block;font-size:12px;font-weight:700;margin-top:6px">View →</span></span></button></sc-for>
</div>
</section>

<div style="position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center">
<div style="width:100%;max-width:520px;background:rgba(255,255,255,0.98);border-top:1px solid #EAE2D6;padding:10px 16px 14px;box-sizing:border-box;display:flex;align-items:center;gap:12px">
<img src="{{p.bottle}}" alt="" style="height:52px;width:auto">
<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px">{{perBottle}} <span style="font-weight:500;color:#5B5150;font-size:12px">/ bottle</span></div><div style="font-size:11.5px;color:#5B5150">{{barLine}}</div></div>
<a href="/m/box" style="background:{{p.color}};color:#FFFFFF;text-decoration:none;font-weight:700;font-size:14px;padding:14px 18px;border-radius:999px;white-space:nowrap">Build my box</a>
</div>
</div>
</div>
</template>

const tierName = T.filter((t) => t[0] === s.tier)[0][1];
const steps = [['01', 'Twist', 'Hold the band, twist counter-clockwise.'], ['02', 'Tap', 'Tap firmly. The ingredients drop in.'], ['03', 'Shake', 'A few seconds. No shaker.'], ['04', 'Glow', 'Freshly mixed, anywhere.']].map(([n, t, d], i) => ({ n, t, d, bg: i === 3 ? p.color : '#2A2020', c: i === 3 ? '#FFFFFF' : '#E9849F', tc: i === 3 ? '#FFFFFF' : '#BDB2AF' }));
const others = ORDER.filter((k) => k !== s.id).map((k) => ({ name: P[k].name, bg: P[k].bg, fg: P[k].fg, bottle: P[k].bottle, pick: () => this.setState({ id: k, img: 0 }) }));
const n = p.imgs.length;
return {
p, tabs, gal, dots, tiers, steps, others,
prev: () => this.setState({ img: (s.img + n - 1) % n }), next: () => this.setState({ img: (s.img + 1) % n }),
subOn: isSub ? 'true' : 'false', onceOn: isSub ? 'false' : 'true',
subBg: isSub ? '#1C1414' : 'transparent', subFg: isSub ? '#FBF7F0' : '#1C1414', onceBg: !isSub ? '#1C1414' : 'transparent', onceFg: !isSub ? '#FBF7F0' : '#1C1414',
pickSub: () => this.setState({ buy: 'sub' }), pickOnce: () => this.setState({ buy: 'once' }),
buyNote: isSub ? 'Mix in any drink next. Extra 5% off, free delivery, skip anytime.' : 'Any mix, delivered once. No subscription.',
perBottle: money(base * (1 - dOf(s.tier) / 100)),
barLine: tierName + ' · ' + s.tier + ' bottles · ' + (isSub ? 'subscribed' : 'one-time') + ' · −' + dOf(s.tier) + '%'
};
}
}
