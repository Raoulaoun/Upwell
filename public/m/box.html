<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="UpWell — functional drinks with a smart cap. Design preview.">
<meta name="theme-color" content="#C42E62">
<title>UpWell — Build your box</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<script>(function(){var m=location.search.match(/view=(desktop|mobile)/);try{if(m)sessionStorage.setItem('uw-view',m[1]);var p=sessionStorage.getItem('uw-view');}catch(e){}var small=window.matchMedia('(max-width: 760px)').matches;var want=p?p==='mobile':small;if(want!==true){location.replace('/box'+location.hash);}})();</script>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
body{margin:0;background:#FBF7F0}
a{color:#1C1414}a:hover{color:#C42E62}
.disp{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:0.005em;line-height:0.95}
.mono{font-family:'IBM Plex Mono',monospace;font-weight:600;text-transform:uppercase;letter-spacing:0.04em}
.b{font:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
.q{font:inherit;cursor:pointer;width:44px;height:44px;border-radius:50%;font-size:22px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.q:active{transform:scale(0.9)}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.shine{animation:shine 2.6s ease-in-out infinite}
.sheet{transition:max-height .35s cubic-bezier(.2,.7,.2,1)}
@keyframes pop{0%{opacity:0;transform:translateY(-30px) scale(.6)}100%{opacity:1;transform:none}}
@keyframes shine{0%,100%{box-shadow:0 16px 34px rgba(196,46,98,0.25)}50%{box-shadow:0 16px 46px rgba(196,46,98,0.5)}}
@media (prefers-reduced-motion:reduce){.pop,.shine{animation:none}}
.drawer{transition:transform .35s cubic-bezier(.2,.7,.2,1)}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="font-family:'Archivo',sans-serif;color:#1C1414;background:#FBF7F0;min-height:100vh;max-width:520px;margin:0 auto;overflow-x:clip;padding-bottom:{{padB}}">

<header style="position:sticky;top:0;z-index:30;background:rgba(255,255,255,0.97);backdrop-filter:blur(12px);border-bottom:1px solid #EFE7DB">
<div class="px" style="display:flex;align-items:center;justify-content:space-between;height:60px">
<button class="b" type="button" onClick="{{openMenu}}" aria-label="Open menu" style="width:44px;height:44px;display:flex;align-items:center;justify-content:flex-start"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C1414" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
<a href="/m/" aria-label="UpWell home" style="display:flex;align-items:center;min-height:44px"><img src="/assets/31123edbeba1cd87a31fcf992a67861d.png" alt="UpWell" style="height:22px;width:auto;display:block"></a>
<a href="/m/cart" aria-label="Cart, 1 box" style="width:44px;height:44px;display:flex;align-items:center;justify-content:flex-end;position:relative"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#1C1414" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></svg><span style="position:absolute;top:5px;right:-3px;width:17px;height:17px;border-radius:50%;background:#C42E62;color:#FFFFFF;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center">1</span></a>
</div>
</header>

<sc-if value="{{menu}}" hint-placeholder-val="{{false}}">
<div style="position:fixed;inset:0;z-index:50;display:flex">
<div class="drawer" style="width:84%;max-width:380px;background:#FFFFFF;height:100%;box-sizing:border-box;padding:18px 22px 28px;display:flex;flex-direction:column;gap:6px;box-shadow:20px 0 60px rgba(0,0,0,0.25);overflow-y:auto">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><img src="/assets/31123edbeba1cd87a31fcf992a67861d.png" alt="UpWell" style="height:22px;width:auto"><button class="b" type="button" onClick="{{closeMenu}}" aria-label="Close menu" style="width:44px;height:44px;display:flex;align-items:center;justify-content:flex-end"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C1414" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<a href="/m/box" style="background:#C42E62;color:#FFFFFF;text-decoration:none;border-radius:18px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:17px">Build your box <span>→</span></a>
<sc-for list="{{menuDrinks}}" as="d" hint-placeholder-count="4"><a href="/m/product" style="text-decoration:none;display:flex;align-items:center;gap:12px;padding:8px 4px;border-bottom:1px solid #F0E9DF"><img src="{{d.cut}}" alt="" style="height:52px;width:auto"><span><span class="mono" style="display:block;font-size:10px;color:{{d.color}}">{{d.key}}</span><span style="display:block;font-weight:600;font-size:16px;margin-top:3px">{{d.name}}</span></span></a></sc-for>
<sc-for list="{{menuLinks}}" as="l" hint-placeholder-count="5"><a href="{{l.href}}" onClick="{{closeMenu}}" class="disp" style="text-decoration:none;font-size:30px;padding:10px 4px;border-bottom:1px solid #F0E9DF">{{l.label}}</a></sc-for>
<div style="margin-top:auto;padding-top:18px;display:flex;gap:10px;font-size:14px;color:#5B5150"><span>Sign in</span><span>·</span><span>WhatsApp us</span></div>
</div>
<button class="b" type="button" onClick="{{closeMenu}}" aria-label="Close menu" style="flex:1;background:rgba(28,20,20,0.45)"></button>
</div>
</sc-if>

<div style="padding:22px 20px 0">
<div class="mono" style="font-size:11px;color:#C42E62;margin-bottom:8px">Build your box</div>
<h1 class="disp" style="font-size:46px;margin:0 0 16px">Your mix. Your way.</h1>
<div role="group" aria-label="Purchase type" style="display:grid;grid-template-columns:1fr 1fr;background:#FFFFFF;border:1px solid #EAE2D6;border-radius:999px;padding:4px;gap:4px">
<button class="b" type="button" onClick="{{pickSub}}" aria-pressed="{{subOn}}" style="border-radius:999px;min-height:46px;font-weight:700;font-size:14px;background:{{subBg}};color:{{subFg}};transition:all .25s">Subscribe +{{subExtra}}%</button>
<button class="b" type="button" onClick="{{pickOnce}}" aria-pressed="{{onceOn}}" style="border-radius:999px;min-height:46px;font-weight:700;font-size:14px;background:{{onceBg}};color:{{onceFg}};transition:all .25s">One-time</button>
</div>
</div>

<div style="padding:24px 20px 0">
<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px"><span class="disp" style="font-size:22px;color:#C42E62">1</span><span class="disp" style="font-size:20px">Box size</span><span style="font-size:12px;color:#8A7F7C">bigger box, bigger discount</span></div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<sc-for list="{{sizes}}" as="z" hint-placeholder-count="3">
<button class="b" type="button" onClick="{{z.pick}}" aria-pressed="{{z.on}}" style="border-radius:18px;padding:12px 6px;background:{{z.bg}};color:{{z.fg}};border:2px solid {{z.border}};display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .25s">
<span class="disp" style="font-size:36px">{{z.size}}</span>
<span style="font-size:12px;font-weight:600">{{z.name}}</span>
<span class="mono" style="font-size:10px;background:{{z.tagBg}};color:{{z.tagFg}};padding:4px 8px;border-radius:999px">−{{z.disc}}%</span>
</button>
</sc-for>
</div>
<div style="font-size:12.5px;color:#5B5150;margin-top:8px">{{nudge}}</div>
</div>

<div style="padding:18px 20px 0">
<div class="{{boxCls}}" style="background:#C42E62;border-radius:22px;padding:10px 10px 12px;position:relative">
<div style="display:flex;justify-content:space-between;align-items:center;padding:2px 4px 8px"><img src="/assets/da6f4753838cc820e5bdab340ad18692.png" alt="UpWell" style="height:15px;width:auto"><span class="mono" style="font-size:10px;color:#FFD3DF">{{box.name}} · {{filledLabel}}</span></div>
<div style="background:#FBF0E6;border-radius:14px;padding:7px;display:grid;grid-template-columns:repeat({{box.cols}},minmax(0,1fr));gap:4px">
<sc-for list="{{slots}}" as="s" hint-placeholder-count="12"><div style="height:{{box.slotH}};border-radius:7px;background:{{s.bg}};border:1px dashed {{s.dash}};display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative"><sc-if value="{{s.filled}}" hint-placeholder-val="{{false}}"><img class="pop" src="{{s.img}}" alt="{{s.name}}" style="height:94%;width:auto"></sc-if><sc-if value="{{s.empty}}" hint-placeholder-val="{{true}}"><span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#D8C3B4;font-size:14px">+</span></sc-if></div></sc-for>
</div>
</div>
</div>

<div style="padding:22px 20px 0">
<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px"><span class="disp" style="font-size:22px;color:#C42E62">2</span><span class="disp" style="font-size:20px">Fill it your way</span></div>
<div style="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px">
<sc-for list="{{presets}}" as="p" hint-placeholder-count="3"><button class="b" type="button" onClick="{{p.pick}}" style="flex:0 0 auto;border:1.5px solid #D8CEBF;background:#FFFFFF;border-radius:999px;padding:0 12px;min-height:38px;font-weight:600;font-size:12.5px">{{p.label}}</button></sc-for>
<button class="b" type="button" onClick="{{clear}}" style="flex:0 0 auto;color:#8A7F7C;font-weight:600;font-size:12.5px;min-height:38px;padding:0 8px">Clear</button>
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<div style="background:{{r.tint}};border:2px solid {{r.border}};border-radius:18px;display:flex;align-items:center;gap:8px;padding:6px 10px 6px 4px;transition:border-color .3s">
<img src="{{r.cut}}" alt="" style="height:82px;width:auto;flex:0 0 auto">
<div style="flex:1;min-width:0"><div class="mono" style="font-size:9.5px;color:{{r.c}}">{{r.key}}</div><div style="font-weight:700;font-size:15px;margin-top:3px">{{r.name}}</div><div style="font-size:12px;color:#5B5150;margin-top:2px">{{r.fact}}</div></div>
<div style="display:flex;align-items:center;gap:4px;flex:0 0 auto">
<button class="q" type="button" onClick="{{r.minus}}" aria-label="{{r.minusAria}}" style="border:1.5px solid #D8CEBF;background:#FFFFFF;color:#1C1414;opacity:{{r.minusOp}}">−</button>
<span class="disp" style="font-size:22px;width:26px;text-align:center">{{r.qty}}</span>
<button class="q" type="button" onClick="{{r.plus}}" aria-label="{{r.plusAria}}" style="border:none;background:{{r.plusBg}};color:#FFFFFF">+</button>
</div>
</div>
</sc-for>
</div>
</div>

<div style="padding:22px 20px 0">
<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px"><span class="disp" style="font-size:22px;color:#C42E62">3</span><span class="disp" style="font-size:20px">{{step3Title}}</span></div>
<sc-if value="{{isSub}}" hint-placeholder-val="{{true}}">
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<sc-for list="{{freqs}}" as="f" hint-placeholder-count="3"><button class="b" type="button" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="border-radius:16px;padding:10px 4px;min-height:56px;background:{{f.bg}};color:{{f.fg}};border:2px solid {{f.border}};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><span style="font-weight:700;font-size:14px">{{f.label}}</span><span style="font-size:10.5px;opacity:0.75">{{f.note}}</span></button></sc-for>
</div>
<div style="font-size:12.5px;color:#5B5150;margin-top:10px;line-height:1.5">Free delivery · we message you 2–3 days before each delivery to confirm · pay by Whish or cash · skip anytime</div>
</sc-if>
<sc-if value="{{isOnce}}" hint-placeholder-val="{{false}}">
<div style="background:#FFFFFF;border:1px solid #EAE2D6;border-radius:16px;padding:14px;font-size:14px;line-height:1.5"><b>Delivered once.</b> <span style="color:#5B5150">No subscription.</span><br><button class="b" type="button" onClick="{{pickSub}}" style="color:#C42E62;font-weight:700;font-size:14px;min-height:40px">Subscribe instead, save {{subExtra}}% more →</button></div>
</sc-if>
<div style="border:2px dashed #E9849F;border-radius:16px;padding:12px 14px;background:#FDE6E5;font-size:13px;margin-top:14px"><b>New to UpWell?</b> Discovery box coming soon. <span class="mono" style="font-size:9.5px;color:#C42E62">[Offer TBD]</span></div>
<div style="font-size:11px;color:#8A7F7C;text-align:center;margin-top:12px">Sample prices for the prototype · real prices to be confirmed</div>
</div>

<div style="position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center">
<div style="width:100%;max-width:520px;background:#FFFFFF;border-top:1px solid #EAE2D6;border-radius:22px 22px 0 0;box-shadow:0 -14px 40px rgba(28,20,20,0.12);padding:10px 16px 14px;box-sizing:border-box">
<button class="b" type="button" onClick="{{toggleSheet}}" aria-expanded="{{sheetOn}}" style="width:100%;display:flex;justify-content:space-between;align-items:center;min-height:44px">
<span style="text-align:left"><span style="display:flex;align-items:baseline;gap:8px"><span class="disp" style="font-size:28px">{{total}}</span><span style="font-size:12px;color:#8A7F7C;text-decoration:line-through">{{fullPrice}}</span><span class="mono" style="font-size:10px;background:#FDE6E5;color:#C42E62;padding:4px 7px;border-radius:999px">−{{discTotal}}%</span></span><span style="display:block;font-size:12px;color:#5B5150;margin-top:3px">{{perBottle}}/bottle · {{totalNote}}</span></span>
<span style="font-size:12.5px;font-weight:700;color:#5B5150;display:flex;align-items:center;gap:4px">Details <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5B5150" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform:rotate({{chev}});transition:transform .3s"><path d="M6 15l6-6 6 6"/></svg></span>
</button>
<div class="sheet" style="max-height:{{sheetH}};overflow:hidden">
<div style="display:flex;flex-direction:column;gap:6px;font-size:13.5px;padding:8px 0 4px;border-top:1px solid #F0E9DF;margin-top:6px">
<div style="display:flex;justify-content:space-between"><span style="color:#5B5150">{{box.size}} × {{base}}</span><span>{{fullPrice}}</span></div>
<div style="display:flex;justify-content:space-between;color:#1F6E5A"><span>Box discount</span><span>−{{boxDisc}}%</span></div>
<sc-if value="{{isSub}}" hint-placeholder-val="{{true}}"><div style="display:flex;justify-content:space-between;color:#1F6E5A"><span>Subscribe &amp; save</span><span>−{{subExtra}}%</span></div></sc-if>
<div style="display:flex;justify-content:space-between"><span style="color:#5B5150">Delivery</span><span>{{delivery}}</span></div>
<div style="display:flex;justify-content:space-between;font-weight:700;color:#1F6E5A"><span>You save</span><span>{{saved}}</span></div>
</div>
</div>
<sc-if value="{{isFull}}" hint-placeholder-val="{{true}}"><a href="/m/cart" style="display:block;margin-top:8px;background:#C42E62;color:#FFFFFF;text-align:center;text-decoration:none;font-weight:700;font-size:16px;padding:16px;border-radius:999px">{{ctaLabel}} →</a></sc-if>
<sc-if value="{{notFull}}" hint-placeholder-val="{{false}}"><div style="margin-top:8px;background:#F3ECE1;color:#5B5150;text-align:center;font-weight:700;font-size:15px;padding:16px;border-radius:999px">{{remainingLabel}}</div></sc-if>
</div>
</div>
</div>
</template>
<script id="dc-logic" type="text/x-dc" data-props='{"basePrice":{"editor":"number","default":3},"disc6":{"editor":"number","default":5},"disc12":{"editor":"number","default":10},"disc24":{"editor":"number","default":15},"subExtra":{"editor":"number","default":5},"$preview":{"width":390,"height":1900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { size: 12, freq: 4, buy: 'sub', sheet: false, q: { collagen: 6, chocolate: 2, raspberry: 0, matcha: 4 } };
}
renderVals() { return Object.assign(this.__menuVals(), this.__rv()); }
__menuVals() {
const C = { collagen: '/assets/1e312cf70451d331518596eb690219f9.webp', chocolate: '/assets/df1379f946c6783678c913de3b1653e9.webp', raspberry: '/assets/03165d99b540fc3ded3ff290b96b0d9a.webp', matcha: '/assets/5d6a6bf7d30273993f2a59b1dade3aa2.webp' };
const D = [['collagen', 'Glow', 'Collagen + Creatine', '#C42E62'], ['chocolate', 'Recover', 'Chocolate Clear Whey', '#7A4327'], ['raspberry', 'Refresh', 'Raspberry Protein+', '#A61F4E'], ['matcha', 'Reset', 'Coconut Matcha', '#0F7A6C']];
return { menu: !!this.state.menu, openMenu: () => this.setState({ menu: true }), closeMenu: () => this.setState({ menu: false }),
menuDrinks: D.map(([k, key, name, color]) => ({ cut: C[k], key, name, color })),
menuLinks: [['Our drinks', '/m/#drinks'], ['Why UpWell', '/m/#why'], ['Build your box', '/m/box'], ['Ingredients', '/m/#ingredients'], ['App', '/m/#app'], ['Questions', '/m/#faq']].map(([label, href]) => ({ label, href })) };
}
__rv() {
const s = this.state;
const pr = this.props;
const base = Number(pr.basePrice ?? 3);
const DISC = { 6: Number(pr.disc6 ?? 5), 12: Number(pr.disc12 ?? 10), 24: Number(pr.disc24 ?? 15) };
const subExtra = Number(pr.subExtra ?? 5);
const isSub = s.buy === 'sub';
const money = (v) => '$' + v.toFixed(2);
const ORDER = ['collagen', 'chocolate', 'raspberry', 'matcha'];
const P = {
collagen: { name: 'Collagen + Creatine', key: 'Glow · Morning', fact: '30 cal · 7g collagen', c: '#C42E62', tint: '#FDE6E5', cut: '/assets/1e312cf70451d331518596eb690219f9.webp' },
chocolate: { name: 'Chocolate Clear Whey', key: 'Recover · After workout', fact: '45 cal · 9g protein', c: '#7A4327', tint: '#F3E6DD', cut: '/assets/df1379f946c6783678c913de3b1653e9.webp' },
raspberry: { name: 'Raspberry Protein+', key: 'Refresh · Intense training', fact: '45 cal · 9g plant protein', c: '#A61F4E', tint: '#FBE3EA', cut: '/assets/03165d99b540fc3ded3ff290b96b0d9a.webp' },
matcha: { name: 'Coconut Matcha', key: 'Reset · Afternoon', fact: '35 cal · 0g sugar', c: '#0F7A6C', tint: '#E3EFDA', cut: '/assets/5d6a6bf7d30273993f2a59b1dade3aa2.webp' }
};
const total = ORDER.reduce((a, k) => a + s.q[k], 0);
const full = total >= s.size;
const fit = (q, size) => { const n = Object.assign({}, q); let t = ORDER.reduce((a, k) => a + n[k], 0); for (let i = ORDER.length - 1; i >= 0 && t > size; i--) { const k = ORDER.at(i); const c = Math.min(n[k], t - size); n[k] -= c; t -= c; } return n; };
const T = [{ name: 'Explorer', size: 6 }, { name: 'Insider', size: 12 }, { name: 'Legend', size: 24 }];
const dOf = (size) => DISC[size] + (isSub ? subExtra : 0);
const sizes = T.map((t) => { const on = s.size === t.size; return { name: t.name, size: t.size, disc: dOf(t.size), on: on ? 'true' : 'false', bg: on ? '#1C1414' : '#FFFFFF', fg: on ? '#FBF7F0' : '#1C1414', border: on ? '#1C1414' : '#EAE2D6', tagBg: on ? '#E9849F' : '#FDE6E5', tagFg: on ? '#1C1414' : '#C42E62', pick: () => this.setState({ size: t.size, q: fit(s.q, t.size) }) }; });
const rows = ORDER.map((k) => { const p = P[k]; const n = s.q[k];
return { name: p.name, key: p.key, fact: p.fact, c: p.c, tint: p.tint, cut: p.cut, qty: n, border: n > 0 ? p.c : 'transparent', plusBg: full ? '#D8CEBF' : p.c, minusOp: n > 0 ? '1' : '0.4', minusAria: 'Remove one ' + p.name, plusAria: 'Add one ' + p.name,
plus: () => { if (full) return; const q = Object.assign({}, s.q); q[k] = n + 1; this.setState({ q }); },
minus: () => { if (n === 0) return; const q = Object.assign({}, s.q); q[k] = n - 1; this.setState({ q }); } }; });
const share = (w) => { const q = {}; let left = s.size; ORDER.forEach((k, i) => { const v = i === ORDER.length - 1 ? left : Math.round(s.size * w.at(i)); q[k] = Math.max(0, Math.min(v, left)); left -= q[k]; }); return q; };
const presets = [['Even mix', [0.25, 0.25, 0.25, 0.25]], ['Morning to workout', [0.5, 0.25, 0, 0.25]], ['Training heavy', [0.25, 0.375, 0.375, 0]]].map(([label, w]) => ({ label, pick: () => this.setState({ q: share(w) }) }));
const freqs = [[2, 'Daily'], [4, 'Popular'], [6, 'Lighter']].map(([f, note]) => { const on = s.freq === f; return { label: 'Every ' + f + ' wks', note, on: on ? 'true' : 'false', bg: on ? '#1C1414' : '#FFFFFF', fg: on ? '#FBF7F0' : '#1C1414', border: on ? '#1C1414' : '#EAE2D6', pick: () => this.setState({ freq: f }) }; });
const LAY = { 6: { cols: 6, slotH: '64px' }, 12: { cols: 6, slotH: '58px' }, 24: { cols: 8, slotH: '48px' } };
const slots = [];
ORDER.forEach((k) => { for (let i = 0; i < s.q[k]; i++) slots.push({ filled: true, empty: false, img: P[k].cut, name: P[k].name, bg: P[k].tint, dash: 'transparent' }); });
while (slots.length < s.size) slots.push({ filled: false, empty: true, img: '', name: '', bg: 'rgba(255,255,255,0.6)', dash: '#E2CDBE' });
const tier = T.filter((t) => t.size === s.size)[0];
const discTotal = dOf(s.size);
const fullP = base * s.size, totP = fullP * (1 - discTotal / 100);
const next = T.filter((t) => t.size > s.size)[0];
const left = s.size - total;
return {
sizes, rows, presets, freqs, slots,
box: { name: tier.name, size: s.size, cols: LAY[s.size].cols, slotH: LAY[s.size].slotH },
boxCls: full ? 'shine' : '', filledLabel: total + '/' + s.size,
nudge: next ? 'Go ' + next.size + ' bottles to save ' + dOf(next.size) + '%.' : 'Best price per bottle.',
isFull: full, notFull: !full, remainingLabel: 'Add ' + left + ' more bottle' + (left === 1 ? '' : 's'),
isSub, isOnce: !isSub, subOn: isSub ? 'true' : 'false', onceOn: isSub ? 'false' : 'true', subExtra,
subBg: isSub ? '#1C1414' : 'transparent', subFg: isSub ? '#FBF7F0' : '#1C1414', onceBg: !isSub ? '#1C1414' : 'transparent', onceFg: !isSub ? '#FBF7F0' : '#1C1414',
pickSub: () => this.setState({ buy: 'sub' }), pickOnce: () => this.setState({ buy: 'once' }),
step3Title: isSub ? 'Delivery every' : 'One-time delivery',
base: money(base), fullPrice: money(fullP), total: money(totP), saved: money(fullP - totP), perBottle: money(totP / s.size), boxDisc: DISC[s.size], discTotal,
delivery: isSub ? 'Free' : 'At checkout', totalNote: isSub ? 'every ' + s.freq + ' weeks' : 'one time',
ctaLabel: isSub ? 'Subscribe to my box' : 'Add box to cart',
sheetOn: s.sheet ? 'true' : 'false', sheetH: s.sheet ? '220px' : '0px', chev: s.sheet ? '0deg' : '180deg', padB: s.sheet ? '330px' : '190px',
toggleSheet: () => this.setState({ sheet: !s.sheet }),
clear: () => this.setState({ q: { collagen: 0, chocolate: 0, raspberry: 0, matcha: 0 } })
};
}
}
</script>
