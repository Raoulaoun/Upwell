<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="UpWell — functional drinks with a smart cap. Design preview.">
<meta name="theme-color" content="#C42E62">
<title>UpWell — Wellness evolved</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<script>(function(){var m=location.search.match(/view=(desktop|mobile)/);try{if(m)sessionStorage.setItem('uw-view',m[1]);var p=sessionStorage.getItem('uw-view');}catch(e){}var small=window.matchMedia('(max-width: 760px)').matches;var want=p?p==='mobile':small;if(want!==true){location.replace('/'+location.hash);}})();</script>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
body{margin:0;background:#FBF7F0}
a{color:#1C1414}a:hover{color:#C42E62}
.px{padding-left:20px;padding-right:20px}
.disp{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:0.005em;line-height:0.95}
.mono{font-family:'IBM Plex Mono',monospace;font-weight:600;text-transform:uppercase;letter-spacing:0.04em}
.b{font:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
.h2{font-size:44px;margin:0}
.row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 20px 4px;scroll-padding:0 20px}
.row::-webkit-scrollbar{display:none}
.sn{scroll-snap-align:start;flex:0 0 auto}
.marquee{display:flex;width:max-content;animation:marquee 30s linear infinite}
.gal{display:flex;gap:10px;width:max-content;animation:marquee 60s linear infinite}
.float{animation:floaty 5s ease-in-out infinite}
.prog{animation:prog 5s linear both}
.scene{transition:opacity 1s ease}
.fade{transition:opacity .8s ease,transform 1.2s cubic-bezier(.2,.7,.2,1)}
.wob{animation:wobble .7s ease-in-out infinite}
.ripple{animation:ripple 1.1s ease-out infinite}
.spin{animation:spin 2.2s linear infinite}
.glow{animation:glow 2.4s ease-in-out infinite}
.drawer{transition:transform .35s cubic-bezier(.2,.7,.2,1)}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes prog{from{width:0}to{width:100%}}
@keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(4deg)}}
@keyframes ripple{from{transform:scale(.4);opacity:.9}to{transform:scale(2.4);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.95;transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){.marquee,.gal,.float,.prog,.wob,.ripple,.spin,.glow{animation:none}}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="font-family:'Archivo',sans-serif;color:#1C1414;background:#FBF7F0;min-height:100vh;max-width:520px;margin:0 auto;position:relative;overflow-x:hidden;padding-bottom:84px">

<div style="background:#2B0A18;color:#FBF7F0;overflow:hidden;height:32px;display:flex;align-items:center">
<div class="marquee mono" style="font-size:10.5px">
<sc-for list="{{ticker}}" as="t" hint-placeholder-count="12"><span style="display:flex;align-items:center;gap:10px;padding:0 16px;white-space:nowrap"><span style="width:5px;height:5px;border-radius:50%;background:#E9849F"></span>{{t}}</span></sc-for>
</div>
</div>

<header style="position:sticky;top:0;z-index:30;background:rgba(255,255,255,0.97);backdrop-filter:blur(12px);border-bottom:1px solid #EFE7DB">
<div class="px" style="display:flex;align-items:center;justify-content:space-between;height:60px">
<button class="b" type="button" onClick="{{openMenu}}" aria-label="Open menu" style="width:44px;height:44px;display:flex;align-items:center;justify-content:flex-start"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C1414" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
<a href="/m/" aria-label="UpWell home" style="display:flex;align-items:center;min-height:44px"><img src="/assets/31123edbeba1cd87a31fcf992a67861d.png" alt="UpWell" style="height:22px;width:auto;display:block"></a>
<a href="/m/cart" aria-label="Cart, 1 box" style="width:44px;height:44px;display:flex;align-items:center;justify-content:flex-end;position:relative"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#1C1414" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></svg><span style="position:absolute;top:6px;right:-6px;width:17px;height:17px;border-radius:50%;background:#C42E62;color:#FFFFFF;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center">1</span></a>
</div>
</header>

<sc-if value="{{menu}}" hint-placeholder-val="{{false}}">
<div style="position:fixed;inset:0;z-index:50;display:flex">
<div class="drawer" style="width:84%;max-width:380px;background:#FFFFFF;height:100%;box-sizing:border-box;padding:18px 22px 28px;display:flex;flex-direction:column;gap:6px;box-shadow:20px 0 60px rgba(0,0,0,0.25);overflow-y:auto">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><img src="/assets/31123edbeba1cd87a31fcf992a67861d.png" alt="UpWell" style="height:22px;width:auto"><button class="b" type="button" onClick="{{closeMenu}}" aria-label="Close menu" style="width:44px;height:44px;display:flex;align-items:center;justify-content:flex-end"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C1414" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<a href="/m/box" style="background:#C42E62;color:#FFFFFF;text-decoration:none;border-radius:18px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:17px">Build your box <span>→</span></a>
<sc-for list="{{menuDrinks}}" as="d" hint-placeholder-count="4"><a href="/m/product" style="text-decoration:none;display:flex;align-items:center;gap:12px;padding:8px 4px;border-bottom:1px solid #F0E9DF"><img src="{{d.cut}}" alt="" style="height:52px;width:auto"><span><span class="mono" style="display:block;font-size:10px;color:{{d.color}}">{{d.key}}</span><span style="display:block;font-weight:600;font-size:16px;margin-top:3px">{{d.name}}</span></span></a></sc-for>
<sc-for list="{{menuLinks}}" as="l" hint-placeholder-count="5"><a href="{{l.href}}" onClick="{{closeMenu}}" class="disp" style="text-decoration:none;font-size:30px;padding:10px 4px;border-bottom:1px solid #F0E9DF">{{l.label}}</a></sc-for>
<div style="margin-top:auto;padding-top:18px;display:flex;gap:10px;font-size:14px;color:#5B5150"><span>Sign in</span><span>·</span><span>WhatsApp us</span></div>
</div>
<button class="b" type="button" onClick="{{closeMenu}}" aria-label="Close menu" style="flex:1;background:rgba(28,20,20,0.45)"></button>
</div>
</sc-if>

<section style="background:{{hero.bg}};color:{{hero.fg}};transition:background-color 1s,color 1s;overflow:hidden">
<div style="padding:16px 16px 18px">
<div style="position:relative;aspect-ratio:1 / 1">
<div style="position:absolute;inset:0;border-radius:26px;overflow:hidden;box-shadow:0 24px 50px rgba(0,0,0,0.25);background:{{hero.bg}}">
<sc-for list="{{heroScenes}}" as="h" hint-placeholder-count="4"><img class="scene" src="{{h.img}}" alt="{{h.alt}}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:{{h.op}}"></sc-for>
</div>
<div class="float" style="position:absolute;left:-6px;top:10%;background:#FFFFFF;color:#1C1414;border-radius:14px;padding:10px 12px;box-shadow:0 12px 28px rgba(28,20,20,0.18)"><div class="disp" style="font-size:26px;color:{{hero.color}}">{{hero.s1}}</div><div class="mono" style="font-size:9px;margin-top:4px;color:#5B5150">{{hero.l1}}</div></div>
<div style="position:absolute;right:-6px;top:52%;background:#FFFFFF;color:#1C1414;border-radius:14px;padding:10px 12px;box-shadow:0 12px 28px rgba(28,20,20,0.18)"><div class="disp" style="font-size:26px;color:{{hero.color}}">{{hero.s2}}</div><div class="mono" style="font-size:9px;margin-top:4px;color:#5B5150">{{hero.l2}}</div></div>
</div>
</div>
<div class="px" style="padding-top:4px;padding-bottom:30px;position:relative">
<div class="mono" style="font-size:11px;color:{{hero.accent}};margin-bottom:12px;transition:color 1s">{{hero.moment}}</div>
<h1 class="disp" style="font-size:58px;margin:0 0 14px">Wellness evolved. <span style="color:{{hero.accent}};transition:color 1s">Your drink</span> should too.</h1>
<p style="font-size:16px;line-height:1.5;margin:0 0 20px;opacity:0.86">Real functional ingredients sealed in the cap until the moment you twist. No scoop, no shaker.</p>
<a href="/m/box" style="display:flex;justify-content:center;align-items:center;gap:10px;background:{{hero.btnBg}};color:{{hero.btnFg}};text-decoration:none;font-weight:700;font-size:17px;padding:17px;border-radius:999px;transition:background-color 1s,color 1s">Build your box →</a>
<a href="#how" style="display:block;text-align:center;color:{{hero.fg}};font-weight:600;font-size:15px;padding:14px 0 0">See how it works</a>
</div>
<div class="row" style="padding-bottom:24px">
<sc-for list="{{heroThumbs}}" as="t" hint-placeholder-count="4">
<button class="b sn" type="button" onClick="{{t.pick}}" aria-label="Show {{t.name}}" aria-pressed="{{t.on}}" style="position:relative;overflow:hidden;display:flex;align-items:center;gap:6px;background:{{t.bg}};color:#1C1414;border-radius:12px;padding:4px 12px 4px 4px;min-height:48px">
<img src="{{t.img}}" alt="" style="height:40px;width:auto"><span style="font-weight:600;font-size:12px;text-align:left;line-height:1.15">{{t.l1}}<br>{{t.l2}}</span>
<span class="{{t.barCls}}" style="position:absolute;left:0;bottom:0;height:3px;width:{{t.w}};background:{{t.color}}"></span>
</button>
</sc-for>
</div>
</section>

<section style="background:#FFFFFF;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-bottom:1px solid #EFE7DB">
<div style="padding:16px 20px;border-right:1px solid #EFE7DB;border-bottom:1px solid #EFE7DB;display:flex;gap:10px;align-items:center"><span class="disp" style="font-size:26px;color:#C42E62">&lt;50</span><span style="font-size:12px;line-height:1.3">calories per bottle</span></div>
<div style="padding:16px 20px;border-bottom:1px solid #EFE7DB;display:flex;gap:10px;align-items:center"><span class="disp" style="font-size:26px;color:#C42E62">0G</span><span style="font-size:12px;line-height:1.3">sugar across the range</span></div>
<div style="padding:16px 20px;border-right:1px solid #EFE7DB;display:flex;gap:10px;align-items:center"><span class="disp" style="font-size:26px;color:#C42E62">1–3</span><span style="font-size:12px;line-height:1.3">core ingredients</span></div>
<div style="padding:16px 20px;display:flex;gap:10px;align-items:center"><span class="disp" style="font-size:26px;color:#C42E62">10s</span><span style="font-size:12px;line-height:1.3">sealed to mixed</span></div>
</section>

<section style="padding:56px 0">
<div class="px">
<div class="mono" style="font-size:11px;color:#C42E62;margin-bottom:12px">Your day, upgraded</div>
<h2 class="disp h2" style="margin-bottom:20px">Built for however you move.</h2>
</div>
<div class="row" style="margin-bottom:16px">
<sc-for list="{{moments}}" as="m" hint-placeholder-count="4"><button class="b sn" type="button" onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="border-radius:999px;padding:0 16px;min-height:44px;background:{{m.bg}};color:{{m.fg}};border:1.5px solid {{m.border}};display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;transition:all .3s"><span class="disp" style="font-size:18px">{{m.key}}</span><span style="opacity:0.75;font-size:12px">{{m.short}}</span></button></sc-for>
</div>
<div class="px">
<div style="position:relative;aspect-ratio:4 / 5;border-radius:26px;overflow:hidden;background:#EDE5DA">
<sc-for list="{{momentImgs}}" as="p" hint-placeholder-count="4"><img class="fade" src="{{p.img}}" alt="{{p.alt}}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{p.pos}};opacity:{{p.op}};transform:{{p.tf}}"></sc-for>
<div class="disp" style="position:absolute;left:18px;top:14px;font-size:68px;color:#FFFFFF;text-shadow:0 4px 24px rgba(0,0,0,0.35)">{{mo.key}}</div>
<div style="position:absolute;left:12px;right:12px;bottom:12px;background:rgba(255,255,255,0.96);border-radius:20px;padding:14px">
<div class="mono" style="font-size:10px;color:{{mo.color}}">{{mo.time}}</div>
<div style="font-weight:700;font-size:17px;margin-top:4px">{{mo.drink}}</div>
<div style="font-size:13.5px;color:#5B5150;margin-top:3px;line-height:1.4">{{mo.line}}</div>
<a href="/m/box" style="display:block;margin-top:12px;background:{{mo.color}};color:#FFFFFF;text-decoration:none;text-align:center;font-weight:700;padding:13px;border-radius:999px">Add to my box</a>
</div>
</div>
</div>
</section>

<section id="drinks" style="padding:56px 0;background:#FFFFFF">
<div class="px" style="margin-bottom:20px">
<div class="mono" style="font-size:11px;color:#C42E62;margin-bottom:12px">The range</div>
<h2 class="disp h2">Four drinks. One smart cap.</h2>
<p style="font-size:13px;color:#8A7F7C;margin:10px 0 0">Swipe · tap a card to see inside</p>
</div>
<div class="row">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
<div class="sn" style="width:272px;height:430px;border-radius:26px;overflow:hidden;position:relative;background:{{c.bgNow}};color:{{c.fgNow}};transition:background-color .4s,color .4s">
<sc-if value="{{c.front}}" hint-placeholder-val="{{true}}">
<div style="display:flex;flex-direction:column;height:100%;box-sizing:border-box">
<div style="padding:20px 20px 0"><div class="mono" style="font-size:10px;color:{{c.color}}">{{c.moment}}</div><div class="disp" style="font-size:28px;margin-top:8px">{{c.name}}</div><div style="font-size:13.5px;line-height:1.4;margin-top:8px;color:#4E4446">{{c.line}}</div></div>
<div style="flex:1 1 auto;min-height:0;display:flex;justify-content:center;align-items:flex-end;width:100%"><img src="{{c.cut}}" alt="" style="height:200px;max-height:100%;width:auto;display:block;margin:0 auto;filter:drop-shadow(0 16px 16px rgba(28,20,20,0.2))"></div>
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px 16px 20px"><div class="mono" style="flex:1 1 auto;min-width:0;font-size:9.5px;line-height:1.3;color:#4E4446">{{c.fact}}</div><div style="flex:0 0 auto;background:#1C1414;color:#FBF7F0;border-radius:999px;padding:9px 13px;font-weight:600;font-size:12px;white-space:nowrap">See inside</div></div>
</div>
</sc-if>
<sc-if value="{{c.back}}" hint-placeholder-val="{{false}}">
<div style="display:flex;flex-direction:column;padding:20px;height:100%;box-sizing:border-box">
<div class="mono" style="font-size:10px;color:{{c.accent}}">{{c.moment}}</div>
<div class="disp" style="font-size:26px;margin-top:8px">{{c.name}}</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:16px"><sc-for list="{{c.stats}}" as="s" hint-placeholder-count="4"><div style="background:#2A2020;border-radius:14px;padding:12px"><div class="disp" style="font-size:22px;color:{{c.accent}}">{{s.big}}</div><div class="mono" style="font-size:9px;margin-top:4px;color:#BDB2AF">{{s.small}}</div></div></sc-for></div>
<div style="font-size:13px;line-height:1.45;color:#BDB2AF;margin-top:14px">{{c.why}}</div>
<div style="margin-top:auto;font-size:12px;color:#8F8482;font-weight:600">Tap to flip back</div>
</div>
</sc-if>
<button class="b" type="button" onClick="{{c.flip}}" aria-label="{{c.aria}}" style="position:absolute;inset:0;width:100%;height:100%;background:transparent;-webkit-tap-highlight-color:transparent"></button>
</div>
</sc-for>
</div>
</section>

<section id="box" style="background:#C42E62;color:#FFFFFF;padding:56px 20px">
<div class="mono" style="font-size:11px;color:#FFD3DF;margin-bottom:12px">Build your box</div>
<h2 class="disp h2" style="margin-bottom:12px">Your mix. Your schedule.</h2>
<p style="font-size:15px;line-height:1.55;color:#FFE4EB;margin:0 0 22px">Mix all four drinks in one box. The more bottles, the more you save. Subscribe for an extra 5%, or buy once.</p>
<div style="display:flex;flex-direction:column;gap:10px">
<sc-for list="{{tiers}}" as="t" hint-placeholder-count="3">
<a href="/m/box" style="text-decoration:none;background:{{t.bg}};color:{{t.fg}};border-radius:22px;padding:14px;display:flex;gap:12px;align-items:center">
<span style="width:112px;height:86px;border-radius:14px;background:{{t.crate}};display:flex;align-items:flex-end;justify-content:center;overflow:hidden;flex:0 0 auto"><sc-for list="{{t.bottles}}" as="x" hint-placeholder-count="5"><img src="{{x}}" alt="" style="height:{{t.h}};width:auto;margin:0 -3px"></sc-for></span>
<span style="flex:1;min-width:0"><span class="mono" style="display:block;font-size:10px;color:{{t.sub}}">{{t.size}} bottles</span><span class="disp" style="display:block;font-size:24px;margin-top:4px">{{t.name}}</span><span style="display:block;font-size:12.5px;color:{{t.sub}};margin-top:4px">Save {{t.save}}% · {{t.subSave}}% subscribed</span></span>
<span aria-hidden="true" style="font-size:18px">→</span>
</a>
</sc-for>
</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px">
<div style="background:rgba(255,255,255,0.13);border-radius:18px;padding:14px;font-size:13px;line-height:1.45"><b style="font-size:15px">Subscribe &amp; save</b><br><span style="color:#FFE4EB">Extra 5%, free delivery. We confirm each delivery first.</span></div>
<div style="background:rgba(255,255,255,0.13);border-radius:18px;padding:14px;font-size:13px;line-height:1.45"><b style="font-size:15px">One-time</b><br><span style="color:#FFE4EB">Any box, delivered once. No commitment.</span></div>
</div>
<div style="margin-top:12px;border:2px dashed #FFD3DF;border-radius:18px;padding:14px;font-size:13.5px"><b>New to UpWell?</b> Discovery box coming soon. <span class="mono" style="font-size:10px;color:#FFD3DF">[Offer TBD]</span></div>
</section>

<section id="difference" style="padding:56px 0">
<div class="px" style="margin-bottom:20px">
<div class="mono" style="font-size:11px;color:#C42E62;margin-bottom:12px">The UpWell difference</div>
<h2 class="disp h2">Wellness has evolved. Your drink should too.</h2>
</div>
<div class="row">
<sc-for list="{{diff}}" as="d" hint-placeholder-count="5"><div class="sn" style="width:260px;min-height:250px;box-sizing:border-box;border-radius:22px;padding:20px;background:{{d.bg}};color:{{d.fg}};border:1px solid {{d.border}}"><div class="disp" style="font-size:42px;color:{{d.num}}">{{d.n}}</div><div class="disp" style="font-size:22px;margin:10px 0 8px">{{d.t}}</div><div style="font-size:14px;line-height:1.5;opacity:0.85">{{d.x}}</div></div></sc-for>
</div>
</section>

<section id="app" style="padding:56px 20px;background:#FFFFFF;overflow:hidden">
<div class="mono" style="font-size:11px;color:#C42E62;margin-bottom:12px">The UpWell app</div>
<h2 class="disp h2" style="margin-bottom:12px">More than a drink. A way to move.</h2>
<p style="font-size:15px;line-height:1.55;color:#5B5150;margin:0 0 20px">Your box comes with an app that turns the ritual into progress, and a community.</p>
<div style="display:flex;justify-content:center;position:relative;margin-bottom:22px">
<div style="position:absolute;width:280px;height:280px;border-radius:50%;background:#FDE6E5;top:30px"></div>
<div class="float" style="position:relative;width:200px;height:400px;border-radius:34px;background:#FBF7F0;border:7px solid #1C1414;padding:14px 12px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;box-shadow:0 30px 60px rgba(28,20,20,0.2)">
<div style="display:flex;justify-content:space-between;align-items:center"><span class="disp" style="font-size:18px">Today</span><span style="font-size:9px;font-weight:700;color:#C42E62">1,240 pts</span></div>
<div style="background:#1C1414;color:#FBF7F0;border-radius:11px;padding:9px;font-size:9.5px;line-height:1.4"><b style="color:#E9849F">COACH · </b>Club run at 6:30. Raspberry Protein+ after.</div>
