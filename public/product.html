<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="UpWell — functional drinks with a smart cap. Design preview.">
<meta name="theme-color" content="#C42E62">
<title>UpWell — Product details</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
body{margin:0;background:#FBF7F0}
a{color:#1C1414}a:hover{color:#C42E62}
.wrap{max-width:1280px;margin:0 auto;padding:0 28px}
.disp{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:0.005em;line-height:0.95}
.nav-links{display:flex;gap:34px}
.b{font:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
.mono{font-family:'IBM Plex Mono',monospace;font-weight:600;text-transform:uppercase;letter-spacing:0.04em}
.lift{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.lift:hover{transform:translateY(-6px);box-shadow:0 22px 44px rgba(28,20,20,0.12)}
.pill{transition:transform .2s ease,box-shadow .2s ease}
.pill:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(28,20,20,0.2)}
details[open] .chev{transform:rotate(45deg)}
.chev{transition:transform .25s}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
@media (max-width:760px){.nav-links{display:none}.ptitle{font-size:56px !important}}
.mnav{display:none}
.mnav>summary{list-style:none;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.mnav>summary::-webkit-details-marker{display:none}
.mnav-panel{position:fixed;left:0;right:0;top:78px;background:#FFFFFF;border-bottom:1px solid #EFE7DB;box-shadow:0 24px 40px rgba(28,20,20,0.14);padding:6px 20px 20px;display:flex;flex-direction:column;z-index:40}
.mnav-panel a{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:26px;line-height:1;color:#1C1414;text-decoration:none;padding:16px 0;border-bottom:1px solid #F0E9DF}
.mnav-panel a.mnav-cta{margin-top:14px;border:none;background:#C42E62;color:#FFFFFF;text-align:center;border-radius:999px;font-family:'Archivo',sans-serif;text-transform:none;font-weight:700;font-size:17px;padding:16px}
@media (max-width:820px){
.nav-links{display:none !important}
.mnav{display:block}
.signin-label{display:none}
.wrap{padding-left:18px !important;padding-right:18px !important}
h1.disp,h2.disp{font-size:clamp(34px,11vw,52px) !important}
h1.disp.m-hero-title{font-size:26px !important}
.m-kw{font-size:84px !important}
.m-title{font-size:32px !important;white-space:normal !important}
.m-deck{margin-right:26px !important;height:auto !important;width:76% !important;min-height:0 !important}
.m-chip{left:-10px !important;bottom:14px !important;max-width:230px !important}
.m-tabs{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
.m-pad{padding:26px !important}
}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="font-family:'Archivo',sans-serif;color:#1C1414;background:#FBF7F0;min-height:100vh;padding-bottom:76px">

<header style="position:sticky;top:0;z-index:20;background:rgba(255,255,255,0.97);backdrop-filter:blur(12px);border-bottom:1px solid #EFE7DB">
<div class="wrap" style="display:flex;align-items:center;justify-content:space-between;height:78px;gap:20px">
<div style="display:flex;align-items:center;gap:44px">
<a href="/" aria-label="UpWell home" style="display:flex;align-items:center;min-height:44px"><img src="/assets/31123edbeba1cd87a31fcf992a67861d.png" alt="UpWell" style="height:30px;width:auto;display:block"></a>
<nav class="nav-links" aria-label="Main">
<a href="/drinks" style="text-decoration:none;font-weight:600;font-size:17px;color:#C42E62">Our drinks</a>
<a href="/#why" style="text-decoration:none;font-weight:500;font-size:17px;">Why UpWell</a>
<a href="/box" style="text-decoration:none;font-weight:500;font-size:17px;">Build your box</a>
<a href="/#ingredients" style="text-decoration:none;font-weight:500;font-size:17px;">Ingredients</a>
<a href="/contact" style="text-decoration:none;font-weight:500;font-size:17px;">Contact</a>
</nav>
</div>
<div style="display:flex;align-items:center;gap:10px">
<a href="/cart" aria-label="Cart" style="display:flex;width:44px;height:44px;align-items:center;justify-content:center"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#1C1414" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></svg></a>
<a href="#" aria-label="Sign in" style="display:flex;align-items:center;gap:8px;min-height:44px;text-decoration:none;font-weight:500;font-size:16px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C1414" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg><span class="signin-label">Sign in</span></a>
<details class="mnav"><summary aria-label="Menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C1414" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></summary><nav class="mnav-panel" aria-label="Mobile"><a href="/drinks">Our drinks</a><a href="/#why">Why UpWell</a><a href="/box">Build your box</a><a href="/#ingredients">Ingredients</a><a href="/contact">Contact</a><a href="/box" class="mnav-cta">Build your box →</a></nav></details>
</div>
</div>
</header>

<div class="wrap" style="padding-top:20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
<a href="/drinks" style="font-weight:700;font-size:14px;text-decoration:none;margin-right:10px;min-height:44px;display:flex;align-items:center">← All drinks</a>
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button class="b" type="button" onClick="{{t.pick}}" style="border-radius:999px;padding:0 16px;min-height:44px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;background:{{t.bg}};color:{{t.fg}};border:1.5px solid {{t.border}}"><span style="width:10px;height:10px;border-radius:50%;background:{{t.dot}}"></span>{{t.name}}</button>
</sc-for>
</div>

<section style="padding:24px 0 72px">
<div class="wrap" style="display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start">
<div style="flex:1 1 520px;min-width:0;display:flex;flex-direction:column;gap:14px">
<div style="background:{{p.bg}};border-radius:32px;overflow:hidden;aspect-ratio:1 / 1;position:relative">
<sc-for list="{{gal}}" as="g" hint-placeholder-count="3"><img src="{{g.img}}" alt="{{g.alt}}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{g.pos}};opacity:{{g.op}};transform:{{g.tf}};transition:opacity .6s ease,transform 1.2s cubic-bezier(.2,.7,.2,1)"></sc-for>
<sc-if value="{{showVideo}}" hint-placeholder-val="{{false}}"><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#1C1414;color:#FBF7F0"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#FBF7F0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4z"/></svg><div class="disp" style="font-size:32px">Twist · Tap · Shake</div><div style="font-size:14px;color:#BDB2AF">[Footage: the cap being twisted, tapped and mixed]</div></div></sc-if>
<div class="mono" style="position:absolute;left:18px;top:18px;background:rgba(255,255,255,0.92);color:#1C1414;font-size:11px;padding:7px 12px;border-radius:999px">{{p.label}}</div>
</div>
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">
<sc-for list="{{thumbs}}" as="g" hint-placeholder-count="4">
<button class="b" type="button" onClick="{{g.pick}}" aria-label="{{g.label}}" style="border-radius:16px;overflow:hidden;aspect-ratio:1/1;background:{{g.bg}};border:2px solid {{g.border}};display:flex;align-items:center;justify-content:center;color:{{g.fg}};font-size:11px;font-weight:700;text-align:center;padding:0">
<sc-if value="{{g.hasImg}}" hint-placeholder-val="{{true}}"><img src="{{g.img}}" alt="" style="width:100%;height:100%;object-fit:{{g.fit}};display:block"></sc-if>
<sc-if value="{{g.noImg}}" hint-placeholder-val="{{false}}"><span style="padding:6px">{{g.label}}</span></sc-if>
</button>
</sc-for>
</div>
</div>

<div style="flex:1 1 440px;min-width:0">
<div style="display:flex;align-items:baseline;gap:12px;margin-bottom:10px"><span class="disp" style="font-size:34px;color:{{p.color}}">{{p.key}}</span><span class="mono" style="font-size:12px;color:#8A7F7C">{{p.label}}</span></div>
<h1 class="disp ptitle" style="font-size:76px;margin:0 0 14px">{{p.name}}</h1>
<p style="font-size:24px;line-height:1.35;font-weight:600;margin:0 0 14px">{{p.emotion}}</p>
<p style="font-size:16px;line-height:1.6;color:#5B5150;margin:0 0 20px">{{p.desc}}</p>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px">
<sc-for list="{{p.facts}}" as="f" hint-placeholder-count="4"><span style="background:{{p.tint}};color:#1C1414;border-radius:999px;padding:9px 14px;font-weight:700;font-size:13px">{{f}}</span></sc-for>
</div>

<div style="margin-bottom:24px">
<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid #EAE2D6;padding-bottom:10px"><span class="mono" style="font-size:12px;color:{{p.color}}">What's inside</span><span style="font-size:13px;color:#8A7F7C">Tap an ingredient to learn more</span></div>
<sc-for list="{{ings}}" as="i" hint-placeholder-count="4">
<details style="border-bottom:1px solid #EAE2D6;padding:14px 0" open="{{i.open}}"><summary style="display:flex;justify-content:space-between;align-items:center;gap:16px;font-weight:700;font-size:16px;min-height:28px"><span>{{i.name}}</span><span style="display:flex;align-items:center;gap:14px"><span style="color:{{p.color}};font-size:16px">{{i.dose}}</span><span class="chev" aria-hidden="true" style="width:30px;height:30px;border-radius:50%;background:{{p.tint}};display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600">+</span></span></summary><p style="color:#4E4446;line-height:1.65;font-size:15px;margin:10px 0 0">{{i.note}}</p></details>
</sc-for>
<p style="font-size:12.5px;color:#8A7F7C;margin:12px 0 0">Full label: {{p.extras}} · 230 ml</p>
</div>

<div style="background:#FFFFFF;border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:14px;border:1px solid #EAE2D6;box-shadow:0 20px 50px rgba(28,20,20,0.06)">
<div style="display:flex;gap:14px;align-items:center"><img src="{{p.bottle}}" alt="" style="height:84px;width:auto"><div><div style="font-weight:700;font-size:17px">Want {{p.name}}?</div><div style="font-size:14px;color:#5B5150;margin-top:4px;line-height:1.45">UpWell comes in boxes you fill yourself. Add it to your box and mix it with any other drink.</div></div></div>

</div></div>
</div>
</section>



<section style="padding:0 0 80px">
<div class="wrap">
<div style="margin-bottom:28px"><div class="mono" style="font-size:12px;color:{{p.color}};margin-bottom:12px">From the UpWell Journal</div><h2 class="disp" style="font-size:52px;margin:0">Read more about what's inside</h2></div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:20px">
<sc-for list="{{p.articles}}" as="a" hint-placeholder-count="3">

</a>
</sc-for>
</div>
<p style="font-size:12px;color:#8A7F7C;margin:14px 0 0">[Articles to be written: titles are suggestions]</p>

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px">

<button class="b" type="button" onClick="{{o.pick}}" style="text-align:left;background:{{o.bg}};color:{{o.fg}};border-radius:26px;overflow:hidden;display:flex;align-items:center">
<img src="{{o.bottle}}" alt="" style="height:220px;width:auto;display:block">
<span style="padding:20px 20px 20px 4px"><span style="display:block;font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;opacity:0.85">{{o.moment}}</span><span class="disp" style="display:block;font-size:28px;margin-top:6px">{{o.name}}</span><span style="display:block;font-weight:700;font-size:14px;margin-top:14px">See product details →</span></span>
</button>
</sc-for>
</div>
</div>
</section>

<div class="wrap">
<img src="/assets/da6f4753838cc820e5bdab340ad18692.png" alt="UpWell" style="height:80px;width:auto;max-width:100%;display:block;margin-bottom:44px">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:32px;margin-bottom:44px;font-size:15px">

<div style="display:flex;flex-direction:column;gap:10px"><div style="color:#FBF7F0;font-weight:700">UpWell</div><a href="/#why" style="color:#BDB2AF;text-decoration:none">Why UpWell</a><a href="/#ingredients" style="color:#BDB2AF;text-decoration:none">Ingredients</a><a href="/contact" style="color:#BDB2AF;text-decoration:none">Become an ambassador</a></div>

</div>
</footer>

<div style="position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,0.97);backdrop-filter:blur(8px);border-top:1px solid #EAE2D6;z-index:25">
<div class="wrap" style="display:flex;align-items:center;justify-content:space-between;gap:16px;height:72px">
<div style="display:flex;align-items:center;gap:12px;min-width:0"><img src="{{p.bottle}}" alt="" style="height:52px;width:auto"><div style="min-width:0"><div class="disp" style="font-size:20px">{{p.name}}</div><div style="font-size:13px;color:#5B5150">Mix it into your box with any other drink</div></div></div>
<a href="/box" style="background:{{p.color}};color:#FFFFFF;text-decoration:none;font-weight:700;padding:14px 26px;border-radius:999px;white-space:nowrap">Build your box</a>
</div>
</div>
</div>
</template>
