<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="UpWell — functional drinks with a smart cap. Design preview.">
<meta name="theme-color" content="#C42E62">
<title>UpWell — Wellness evolved</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<script>(function(){var m=location.search.match(/view=(desktop|mobile)/);try{if(m)sessionStorage.setItem('uw-view',m[1]);var p=sessionStorage.getItem('uw-view');}catch(e){}var small=window.matchMedia('(max-width: 760px)').matches;var want=p?p==='mobile':small;if(want!==false){location.replace('/m/'+location.hash);}})();</script>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
body{margin:0;background:#FBF7F0}
a{color:#1C1414}a:hover{color:#C42E62}
.wrap{max-width:1280px;margin:0 auto;padding:0 28px}
.disp{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:0.005em;line-height:0.95}
.mono{font-family:'IBM Plex Mono',monospace;font-weight:600;text-transform:uppercase;letter-spacing:0.04em}
.nav-links{display:flex;gap:34px}
.b{font:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
.pill{transition:transform .2s ease,box-shadow .2s ease}
.pill:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(196,46,98,0.28)}
.lift{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.lift:hover{transform:translateY(-8px);box-shadow:0 24px 50px rgba(28,20,20,0.14)}
.zoom img{transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.zoom:hover img{transform:scale(1.06)}
.fade-up{animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.22s}.d3{animation-delay:.34s}.d4{animation-delay:.46s}
.float{animation:floaty 5s ease-in-out infinite}
.marquee{display:flex;width:max-content;animation:marquee 38s linear infinite}
.track{scroll-snap-type:x mandatory;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.snap{scroll-snap-align:start}
.wob{animation:wobble .7s ease-in-out infinite}
.ripple{animation:ripple 1.1s ease-out infinite}
.spin{animation:spin 2.2s linear infinite}
.glow{animation:glow 2.4s ease-in-out infinite}
.fc{perspective:1400px;height:560px}
.fc-in{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.fc:hover .fc-in,.fc-in.on{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:30px;overflow:hidden;display:flex;flex-direction:column}
.fc-back{transform:rotateY(180deg)}
.fc-bottle{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.fc:hover .fc-bottle{transform:translateY(-10px) rotate(-3deg)}
.stage-img{transition:opacity .8s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.bgfade{transition:background-color .9s ease}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(4deg)}}
@keyframes ripple{from{transform:scale(.4);opacity:.9}to{transform:scale(2.4);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.95;transform:scale(1.1)}}
@keyframes prog{from{width:0}to{width:100%}}
.prog{animation:prog 5s linear both}
.gal{display:flex;gap:16px;width:max-content;animation:marquee 70s linear infinite}
.gal:hover{animation-play-state:paused}
.mo{transition:background-color .35s,border-color .35s,transform .35s}
.mo:hover{transform:translateX(6px)}
.scene{transition:opacity 1.1s ease}
.scene img{transition:transform 6s ease-out}
@media (prefers-reduced-motion:reduce){.float,.marquee,.gal,.wob,.ripple,.spin,.glow,.fade-up,.prog{animation:none}}
@media (max-width:820px){.nav-links{display:none}.h1{font-size:62px !important}.hero-img{min-height:440px !important}}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="font-family:'Archivo',sans-serif;color:#1C1414;background:#FBF7F0;min-height:100vh">

<header style="position:sticky;top:0;z-index:20;background:rgba(255,255,255,0.97);backdrop-filter:blur(12px);border-bottom:1px solid #EFE7DB">
<div class="wrap" style="display:flex;align-items:center;justify-content:space-between;height:78px;gap:20px">
<div style="display:flex;align-items:center;gap:44px">
<a href="/" aria-label="UpWell home" style="display:flex;align-items:center;min-height:44px"><img src="/assets/31123edbeba1cd87a31fcf992a67861d.png" alt="UpWell" style="height:30px;width:auto;display:block"></a>
<nav class="nav-links" aria-label="Main">
<a href="/#drinks" style="text-decoration:none;font-weight:500;font-size:17px;">Our drinks</a>
<a href="/#why" style="text-decoration:none;font-weight:500;font-size:17px;">Why UpWell</a>
<a href="/box" style="text-decoration:none;font-weight:500;font-size:17px;">Build your box</a>
<a href="/#ingredients" style="text-decoration:none;font-weight:500;font-size:17px;">Ingredients</a>
<a href="/#app" style="text-decoration:none;font-weight:500;font-size:17px;">App</a>
</nav>
</div>
<div style="display:flex;align-items:center;gap:14px">
<a href="/cart" aria-label="Cart" style="display:flex;width:44px;height:44px;align-items:center;justify-content:center"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#1C1414" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></svg></a>
<a href="#" style="display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:500;font-size:16px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C1414" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>Sign in</a>
</div>
</div>
</header>


<section class="bgfade" style="background:{{hero.bg}};color:{{hero.fg}};position:relative;overflow:hidden;transition:background-color 1.1s ease,color 1.1s ease">
<div style="display:flex;flex-wrap:wrap;min-height:max(560px, calc(100vh - 78px))">
<div style="flex:1 1 520px;min-width:0;display:flex;align-items:center;position:relative;z-index:2">
<div style="padding:32px max(28px, calc((100vw - 1280px) / 2 + 28px));padding-right:36px;max-width:620px">
<div class="mono fade-up" style="font-size:12px;color:{{hero.accent}};margin-bottom:16px;transition:color 1.1s;display:flex;align-items:center;gap:10px"><span style="width:28px;height:2px;background:{{hero.accent}};transition:background-color 1.1s"></span>{{hero.moment}}</div>
<h1 class="disp h1 fade-up d1" style="font-size:min(80px, 5.4vw, 8.4vh);margin:0 0 18px">Wellness<br>evolved.<br><span style="color:{{hero.accent}};transition:color 1.1s">Your drink</span><br>should too.</h1>
<p class="fade-up d2" style="font-size:17px;line-height:1.5;margin:0 0 24px;max-width:480px;opacity:0.86">Real functional ingredients sealed in the cap, away from the water, until the moment you twist. Freshly mixed every time — no scoop, no shaker.</p>
<div class="fade-up d3" style="display:flex;gap:12px;flex-wrap:wrap">
<a href="/box" class="pill" style="background:{{hero.btnBg}};color:{{hero.btnFg}};text-decoration:none;font-weight:600;font-size:17px;padding:19px 34px;border-radius:999px;display:flex;align-items:center;gap:10px;transition:background-color 1.1s,color 1.1s">Build your box <span>→</span></a>
<a href="#how" style="color:{{hero.fg}};text-decoration:none;font-weight:600;font-size:17px;padding:17px 30px;border-radius:999px;border:1.5px solid {{hero.fg}};transition:color 1.1s,border-color 1.1s">See how it works</a>
</div>
<div class="fade-up d4" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:26px">
<sc-for list="{{heroThumbs}}" as="t" hint-placeholder-count="4">
<button class="b" type="button" onClick="{{t.pick}}" aria-label="Show {{t.name}}" aria-pressed="{{t.on}}" style="position:relative;overflow:hidden;display:flex;align-items:center;gap:8px;background:{{t.bg}};color:#1C1414;border-radius:14px;padding:5px 14px 5px 6px;min-height:54px;box-shadow:{{t.sh}};transition:background-color .4s,box-shadow .4s">
<img src="{{t.img}}" alt="" style="height:44px;width:auto;display:block">
<span style="font-weight:600;font-size:13px;text-align:left;line-height:1.15">{{t.l1}}<br>{{t.l2}}</span>
<span class="{{t.barCls}}" style="position:absolute;left:0;bottom:0;height:3px;width:{{t.w}};background:{{t.color}}"></span>
</button>
</sc-for>
</div>
</div>
</div>
<div class="hero-img" style="flex:1 1 560px;min-width:0;display:flex;align-items:center;justify-content:center;padding:28px max(28px, calc((100vw - 1280px) / 2 + 28px)) 28px 28px">
<div style="position:relative;width:100%;max-width:min(600px, calc(100vh - 150px));aspect-ratio:1 / 1">
<div style="position:absolute;inset:0;border-radius:36px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,0.28);background:{{hero.bg}}">
<sc-for list="{{heroScenes}}" as="h" hint-placeholder-count="4">
<img class="scene" src="{{h.img}}" alt="{{h.alt}}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:{{h.op}};transform:{{h.tf}};transition:opacity 1s ease,transform 1.2s cubic-bezier(.2,.7,.2,1)">
</sc-for>
</div>
<div class="float" style="position:absolute;left:-26px;top:12%;background:#FFFFFF;color:#1C1414;border-radius:18px;padding:14px 18px;box-shadow:0 18px 40px rgba(28,20,20,0.18);min-width:110px"><div class="disp" style="font-size:36px;color:{{hero.color}};transition:color .6s">{{hero.s1}}</div><div class="mono" style="font-size:10.5px;margin-top:6px;color:#5B5150">{{hero.l1}}</div></div>
<div style="position:absolute;right:-26px;top:28%;background:#FFFFFF;color:#1C1414;border-radius:18px;padding:14px 18px;box-shadow:0 18px 40px rgba(28,20,20,0.18);min-width:110px"><div class="disp" style="font-size:36px;color:{{hero.color}};transition:color .6s">{{hero.s2}}</div><div class="mono" style="font-size:10.5px;margin-top:6px;color:#5B5150">{{hero.l2}}</div></div>
<a href="/product" class="pill" style="position:absolute;right:-26px;bottom:8%;background:#1C1414;color:#FBF7F0;text-decoration:none;border-radius:18px;padding:12px 18px;box-shadow:0 18px 40px rgba(28,20,20,0.25);display:flex;align-items:center;gap:14px"><span><span class="mono" style="display:block;font-size:10.5px;color:#E9849F">Now showing</span><span style="display:block;font-weight:700;font-size:15px;margin-top:4px">{{hero.name}}</span></span><span style="font-size:18px">→</span></a>
</div>
</div>
</div>
</section>

<section id="why" style="background:#FFFFFF;border-bottom:1px solid #EFE7DB">
<div class="wrap" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0">
<div style="padding:30px 26px;border-right:1px solid #EFE7DB;display:flex;flex-direction:column;gap:12px"><div style="font-weight:700;font-size:17px;letter-spacing:-0.01em">Guilt-free</div><div style="display:flex;gap:14px;align-items:center"><span class="disp" style="font-size:44px;color:#C42E62">&lt;50<span style="text-transform:none"></span></span><span style="font-size:14px;line-height:1.35;color:#5B5150">calories in every bottle</span></div></div>
<div style="padding:30px 26px;border-right:1px solid #EFE7DB;display:flex;flex-direction:column;gap:12px"><div style="font-weight:700;font-size:17px;letter-spacing:-0.01em">Nothing unnecessary</div><div style="display:flex;gap:14px;align-items:center"><span class="disp" style="font-size:44px;color:#C42E62">0<span style="text-transform:none">g</span></span><span style="font-size:14px;line-height:1.35;color:#5B5150">sugar across the range</span></div></div>
<div style="padding:30px 26px;border-right:1px solid #EFE7DB;display:flex;flex-direction:column;gap:12px"><div style="font-weight:700;font-size:17px;letter-spacing:-0.01em">Premium product</div><div style="display:flex;gap:14px;align-items:center"><span class="disp" style="font-size:44px;color:#C42E62">1–3<span style="text-transform:none"></span></span><span style="font-size:14px;line-height:1.35;color:#5B5150">core ingredients, real doses</span></div></div>
<div style="padding:30px 26px;display:flex;flex-direction:column;gap:12px"><div style="font-weight:700;font-size:17px;letter-spacing:-0.01em">Less prep, more life</div><div style="display:flex;gap:14px;align-items:center"><span class="disp" style="font-size:44px;color:#C42E62">10<span style="text-transform:none">s</span></span><span style="font-size:14px;line-height:1.35;color:#5B5150">from sealed to freshly mixed</span></div></div>
</div>
</section>

<section id="drinks" style="padding:110px 0;background:#FFFFFF">
<div class="wrap">
<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:44px">
<div><div class="mono" style="font-size:12px;color:#C42E62;margin-bottom:14px">The range</div>
<h2 style="font-size:58px;font-weight:500;letter-spacing:-0.02em;line-height:1.02;margin:0">Four drinks.<br>One smart cap.</h2></div>
<p style="font-size:16px;color:#8A7F7C;margin:0;display:flex;align-items:center;gap:8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A7F7C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg>Hover or tap a card to see inside</p>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
<div class="fc">
<div class="fc-in {{c.cls}}">
<div class="fc-face" style="background:{{c.tint}}">
<div style="padding:26px 26px 0">
<div class="mono" style="font-size:11px;color:{{c.color}}">{{c.moment}}</div>
<div class="disp" style="font-size:34px;margin-top:12px">{{c.name}}</div>
<div style="font-size:15px;line-height:1.45;margin-top:10px;color:#4E4446">{{c.line}}</div>
</div>
<div style="flex:1;display:flex;justify-content:center;align-items:flex-end;min-height:0;padding-top:10px"><img class="fc-bottle" src="{{c.cut}}" alt="{{c.name}}" style="height:290px;width:auto;display:block;filter:drop-shadow(0 22px 22px rgba(28,20,20,0.2))"></div>
<div style="padding:16px 20px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px">
<span class="mono" style="font-size:11px;color:#4E4446">{{c.fact}}</span>
<button class="b" type="button" onClick="{{c.flip}}" style="background:#1C1414;color:#FBF7F0;border-radius:999px;padding:0 16px;min-height:42px;font-weight:600;font-size:13px">See inside</button>
</div>
</div>
<div class="fc-face fc-back" style="background:#1C1414;color:#FBF7F0;padding:26px">
<div class="mono" style="font-size:11px;color:{{c.accent}}">{{c.moment}}</div>
<div class="disp" style="font-size:30px;margin-top:10px">{{c.name}}</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px">
<sc-for list="{{c.stats}}" as="s" hint-placeholder-count="4"><div style="background:#2A2020;border-radius:16px;padding:14px"><div class="disp" style="font-size:28px;color:{{c.accent}}">{{s.big}}</div><div class="mono" style="font-size:10px;margin-top:6px;color:#BDB2AF">{{s.small}}</div></div></sc-for>
</div>
<div style="font-size:14px;line-height:1.5;color:#BDB2AF;margin-top:16px">{{c.why}}</div>
<div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
<a href="/box" style="background:{{c.accent}};color:#1C1414;text-align:center;text-decoration:none;font-weight:700;padding:14px;border-radius:999px">Add to my box</a>
<a href="/product" style="color:#FBF7F0;text-align:center;text-decoration:none;font-weight:600;padding:12px;border-radius:999px;border:1.5px solid #3A2E2D">Full details</a>
<button class="b" type="button" onClick="{{c.flip}}" style="min-height:34px;color:#8F8482;font-size:13px;font-weight:600">Flip back</button>
</div>
</div>
</div>
</div>
</sc-for>
</div>
</div>
</section>

<section id="how" style="padding:110px 0;background:#FBF7F0">
<div class="wrap" style="display:flex;flex-wrap:wrap;gap:64px;align-items:center">
<div style="flex:1 1 420px;min-width:0;display:flex;justify-content:center">
<div style="position:relative;width:360px;height:560px;display:flex;justify-content:center;align-items:flex-end">
<div class="{{howGlowCls}}" style="position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(233,132,159,0.75),rgba(233,132,159,0) 70%);bottom:90px;opacity:{{howGlowOp}};transition:opacity .6s"></div>
<div class="{{howWobCls}}" style="position:relative;height:540px;transform-origin:50% 85%;transform:rotate({{howRot}});transition:transform .7s cubic-bezier(.2,.7,.2,1)">
<img src="/assets/1e312cf70451d331518596eb690219f9.webp" alt="Collagen + Creatine bottle" style="height:540px;width:auto;display:block;filter:drop-shadow(0 30px 30px rgba(28,20,20,0.22))">
<sc-if value="{{howTap}}" hint-placeholder-val="{{true}}"><div class="ripple" style="position:absolute;left:50%;top:-6px;width:110px;height:110px;margin-left:-55px;border-radius:50%;border:3px solid #C42E62"></div></sc-if>
<sc-if value="{{howTwist}}" hint-placeholder-val="{{false}}"><div class="spin" style="position:absolute;left:50%;top:-14px;width:160px;height:160px;margin-left:-80px;border-radius:50%;border:3px dashed #C42E62"></div></sc-if>
</div>
</div>
</div>
<div style="flex:1 1 480px;min-width:0">
<div class="mono" style="font-size:12px;color:#C42E62;margin-bottom:16px">How it works</div>
<h2 class="disp" style="font-size:76px;margin:0 0 16px">Fresh in<br>ten seconds.</h2>
<p style="font-size:18px;line-height:1.6;color:#5B5150;margin:0 0 30px;max-width:460px">The ingredients wait in the cap, untouched, until you're ready. Click through the steps.</p>
<div style="display:flex;flex-direction:column;gap:10px">
<sc-for list="{{howSteps}}" as="s" hint-placeholder-count="4">
<button class="b" type="button" onClick="{{s.pick}}" style="text-align:left;display:flex;gap:18px;align-items:center;border-radius:22px;padding:18px 20px;background:{{s.bg}};color:{{s.fg}};border:1.5px solid {{s.border}};transition:all .35s">
<span class="disp" style="font-size:40px;width:56px;color:{{s.num}}">{{s.n}}</span>
<span style="flex:1"><span class="disp" style="display:block;font-size:26px">{{s.title}}</span><span style="display:block;font-size:15px;margin-top:6px;opacity:0.85;line-height:1.45">{{s.text}}</span></span>
</button>
</sc-for>
</div>
</div>
</div>
</section>

<section id="box" style="background:#C42E62;color:#FFFFFF;padding:110px 0">
<div class="wrap">
<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:48px">
<div><div class="mono" style="font-size:12px;color:#FFD3DF;margin-bottom:14px">Build your box</div>
<h2 class="disp" style="font-size:80px;margin:0">Your mix.<br>Your schedule.</h2></div>
<p style="font-size:18px;line-height:1.6;color:#FFE4EB;max-width:440px;margin:0">Mix and match all four drinks in one box. The more bottles, the more you save. Subscribe for an extra 5% off, or buy once — no commitment.</p>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px">
<sc-for list="{{tiers}}" as="t" hint-placeholder-count="3">
<a href="/box" class="lift" style="text-decoration:none;background:{{t.bg}};color:{{t.fg}};border-radius:30px;padding:24px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden">
<sc-if value="{{t.rec}}" hint-placeholder-val="{{false}}"><span class="mono" style="position:absolute;top:20px;right:20px;background:#C42E62;color:#FFFFFF;font-size:10.5px;padding:6px 10px;border-radius:999px">Recommended</span></sc-if>
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="mono" style="font-size:11px;color:{{t.sub}}">{{t.size}} bottles</span><span class="mono" style="font-size:10.5px;background:#E9849F;color:#1C1414;padding:5px 9px;border-radius:999px">Save {{t.save}}%</span></div>
<div class="disp" style="font-size:36px">UpWell {{t.name}}</div>
<div style="height:150px;border-radius:20px;background:{{t.crate}};display:flex;align-items:flex-end;justify-content:center;padding:10px 10px 0;margin:6px 0;overflow:hidden">
<sc-for list="{{t.bottles}}" as="x" hint-placeholder-count="6"><img src="{{x}}" alt="" style="height:{{t.h}};width:auto;margin:0 {{t.gap}}"></sc-for>
