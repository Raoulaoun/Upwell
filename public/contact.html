<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="UpWell — functional drinks with a smart cap. Design preview.">
<meta name="theme-color" content="#C42E62">
<title>UpWell — Contact us</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
body{margin:0;background:#FBF7F0}
a{color:#1C1414}a:hover{color:#C42E62}
.wrap{max-width:1280px;margin:0 auto;padding:0 28px}
.disp{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:0.005em;line-height:0.95}
.mono{font-family:'IBM Plex Mono',monospace;font-weight:600;text-transform:uppercase;letter-spacing:0.04em}
.nav-links{display:flex;gap:34px}
.b{font:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
.pill{transition:transform .2s ease,box-shadow .2s ease}
.pill:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(196,46,98,0.28)}
.lift{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.lift:hover{transform:translateY(-8px);box-shadow:0 24px 50px rgba(28,20,20,0.14)}
.zoom img{transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.zoom:hover img{transform:scale(1.06)}
.fade-up{animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.22s}.d3{animation-delay:.34s}.d4{animation-delay:.46s}
.float{animation:floaty 5s ease-in-out infinite}
.marquee{display:flex;width:max-content;animation:marquee 38s linear infinite}
.track{scroll-snap-type:x mandatory;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.snap{scroll-snap-align:start}
.wob{animation:wobble .7s ease-in-out infinite}
.ripple{animation:ripple 1.1s ease-out infinite}
.spin{animation:spin 2.2s linear infinite}
.glow{animation:glow 2.4s ease-in-out infinite}
.fc{perspective:1400px;height:560px}
.fc-in{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.fc:hover .fc-in,.fc-in.on{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:30px;overflow:hidden;display:flex;flex-direction:column}
.fc-back{transform:rotateY(180deg)}
.fc-bottle{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.fc:hover .fc-bottle{transform:translateY(-10px) rotate(-3deg)}
.stage-img{transition:opacity .8s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.bgfade{transition:background-color .9s ease}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(4deg)}}
@keyframes ripple{from{transform:scale(.4);opacity:.9}to{transform:scale(2.4);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.95;transform:scale(1.1)}}
@keyframes prog{from{width:0}to{width:100%}}
.prog{animation:prog 6s linear both}
.gal{display:flex;gap:16px;width:max-content;animation:marquee 70s linear infinite}
.gal:hover{animation-play-state:paused}
.mo{transition:background-color .35s,border-color .35s,transform .35s}
.mo:hover{transform:translateX(6px)}
.scene{transition:opacity 1.1s ease}
.scene img{transition:transform 6s ease-out}
.deck{transition:transform 1s cubic-bezier(.2,.7,.2,1),opacity .9s ease,box-shadow .9s}
.kb{transform:scale(1.02)}
.kb.on{animation:kb 6s ease-out both}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1.02)}}
.kw{animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){.kb.on,.kw{animation:none}.float,.marquee,.gal,.wob,.ripple,.spin,.glow,.fade-up,.prog{animation:none}}
@media (max-width:820px){.nav-links{display:none}.h1{font-size:62px !important}.hero-img{min-height:440px !important}}
.field{font:inherit;width:100%;box-sizing:border-box;padding:15px 16px;border:1.5px solid #D8CEBF;border-radius:14px;background:#FFFFFF;font-size:16px;color:#1C1414}
.field:focus{outline:none;border-color:#C42E62;box-shadow:0 0 0 3px rgba(196,46,98,0.15)}
.lbl{display:block;font-weight:700;font-size:14px;margin-bottom:8px}
.seg{transition:background-color .3s,border-color .3s,transform .3s,box-shadow .3s}
.seg:hover{transform:translateY(-3px)}
.mnav{display:none}
.mnav>summary{list-style:none;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.mnav>summary::-webkit-details-marker{display:none}
.mnav-panel{position:fixed;left:0;right:0;top:78px;background:#FFFFFF;border-bottom:1px solid #EFE7DB;box-shadow:0 24px 40px rgba(28,20,20,0.14);padding:6px 20px 20px;display:flex;flex-direction:column;z-index:40}
.mnav-panel a{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:26px;line-height:1;color:#1C1414;text-decoration:none;padding:16px 0;border-bottom:1px solid #F0E9DF}
.mnav-panel a.mnav-cta{margin-top:14px;border:none;background:#C42E62;color:#FFFFFF;text-align:center;border-radius:999px;font-family:'Archivo',sans-serif;text-transform:none;font-weight:700;font-size:17px;padding:16px}
@media (max-width:820px){
.nav-links{display:none !important}
.mnav{display:block}
.signin-label{display:none}
.wrap{padding-left:18px !important;padding-right:18px !important}
h1.disp,h2.disp{font-size:clamp(34px,11vw,52px) !important}
h1.disp.m-hero-title{font-size:26px !important}
.m-kw{font-size:84px !important}
.m-title{font-size:32px !important;white-space:normal !important}
.m-deck{margin-right:26px !important;height:auto !important;width:76% !important;min-height:0 !important}
.m-chip{left:-10px !important;bottom:14px !important;max-width:230px !important}
.m-tabs{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
.m-pad{padding:26px !important}
}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="font-family:'Archivo',sans-serif;color:#1C1414;background:#FBF7F0;min-height:100vh">
<header style="position:sticky;top:0;z-index:20;background:rgba(255,255,255,0.97);backdrop-filter:blur(12px);border-bottom:1px solid #EFE7DB">
<div class="wrap" style="display:flex;align-items:center;justify-content:space-between;height:78px;gap:20px">
<div style="display:flex;align-items:center;gap:44px">
<a href="/" aria-label="UpWell home" style="display:flex;align-items:center;min-height:44px"><img src="/assets/31123edbeba1cd87a31fcf992a67861d.png" alt="UpWell" style="height:30px;width:auto;display:block"></a>
<nav class="nav-links" aria-label="Main">
<a href="/drinks" style="text-decoration:none;font-weight:500;font-size:17px;">Our drinks</a>
<a href="/#why" style="text-decoration:none;font-weight:500;font-size:17px;">Why UpWell</a>
<a href="/box" style="text-decoration:none;font-weight:500;font-size:17px;">Build your box</a>
<a href="/#ingredients" style="text-decoration:none;font-weight:500;font-size:17px;">Ingredients</a>
<a href="/contact" style="text-decoration:none;font-weight:600;font-size:17px;color:#C42E62">Contact</a>
</nav>
</div>
<div style="display:flex;align-items:center;gap:10px">
<a href="/cart" aria-label="Cart" style="display:flex;width:44px;height:44px;align-items:center;justify-content:center"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#1C1414" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></svg></a>
<a href="#" aria-label="Sign in" style="display:flex;align-items:center;gap:8px;min-height:44px;text-decoration:none;font-weight:500;font-size:16px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C1414" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg><span class="signin-label">Sign in</span></a>
<details class="mnav"><summary aria-label="Menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C1414" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></summary><nav class="mnav-panel" aria-label="Mobile"><a href="/drinks">Our drinks</a><a href="/#why">Why UpWell</a><a href="/box">Build your box</a><a href="/#ingredients">Ingredients</a><a href="/contact">Contact</a><a href="/box" class="mnav-cta">Build your box →</a></nav></details>
</div>
</div>
</header>

<section style="padding:60px 0 28px">
<div class="wrap" style="display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap">
<div><div class="mono" style="font-size:12px;color:#C42E62;margin-bottom:14px">Contact us</div><h1 class="disp" style="font-size:min(84px, 6.2vw);margin:0">Let's work together.</h1></div>
<p style="font-size:18px;line-height:1.55;color:#5B5150;max-width:440px;margin:0">Whether you want to distribute UpWell, stock it, represent it or just ask a question, pick who you are and we'll take it from there.</p>
</div>
</section>

<section style="padding:0 0 28px">
<div class="wrap">
<div role="tablist" aria-label="Who are you?" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px">
<sc-for list="{{segs}}" as="g" hint-placeholder-count="4">
<button class="b seg" type="button" role="tab" aria-selected="{{g.on}}" onClick="{{g.pick}}" style="text-align:left;border-radius:24px;padding:22px;background:{{g.bg}};color:{{g.fg}};border:2px solid {{g.border}};box-shadow:{{g.sh}};display:flex;flex-direction:column;gap:8px;min-height:150px">
<span class="mono" style="font-size:11px;color:{{g.tagC}}">{{g.tag}}</span>
<span class="disp" style="font-size:30px">{{g.label}}</span>
<span style="font-size:14px;line-height:1.45;opacity:0.8">{{g.desc}}</span>
</button>
</sc-for>
</div>
</div>
</section>

<section style="padding:10px 0 90px">
<div class="wrap">
<sc-if value="{{isTrade}}" hint-placeholder-val="{{false}}">
<div style="display:flex;flex-wrap:wrap;gap:24px;align-items:stretch">
<div style="flex:1 1 420px;min-width:0;background:#FFFFFF;border:1px solid #EAE2D6;border-radius:30px;padding:36px;display:flex;flex-direction:column;gap:16px">
<div class="mono" style="font-size:12px;color:{{seg.color}}">{{seg.label}}</div>
<h2 class="disp" style="font-size:46px;margin:0">{{seg.headline}}</h2>
<p style="font-size:17px;line-height:1.6;color:#5B5150;margin:0">{{seg.text}}</p>
<div style="display:flex;flex-direction:column;gap:10px;margin:6px 0 8px"><sc-for list="{{seg.points}}" as="pt" hint-placeholder-count="3"><div style="display:flex;gap:10px;font-size:15px;line-height:1.45"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{seg.color}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:0 0 auto;margin-top:2px"><path d="M4 12l5 5L20 6"/></svg><span>{{pt}}</span></div></sc-for></div>
<a href="#" class="pill" style="margin-top:auto;background:#17795F;color:#FFFFFF;text-decoration:none;font-weight:700;font-size:17px;padding:18px 26px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.2A8.5 8.5 0 1 1 21 12z"/></svg>Chat with us on WhatsApp</a>
<div style="font-size:13px;color:#8A7F7C;text-align:center">Opens WhatsApp with a message ready: "{{seg.waText}}"</div>
</div>
<div style="flex:1 1 420px;min-width:0;background:#FFFFFF;border:1px solid #EAE2D6;border-radius:30px;overflow:hidden;display:flex;flex-direction:column">
<div style="position:relative;flex:1 1 auto;min-height:300px;background:#EFE9DF;background-image:linear-gradient(#E4DCCF 1px,transparent 1px),linear-gradient(90deg,#E4DCCF 1px,transparent 1px);background-size:44px 44px">
<div style="position:absolute;left:12%;top:58%;width:76%;height:14px;background:#FFFFFF;border-radius:7px;transform:rotate(-12deg)"></div>
<div style="position:absolute;left:46%;top:8%;width:12px;height:84%;background:#FFFFFF;border-radius:6px;transform:rotate(18deg)"></div>
<div style="position:absolute;left:0;bottom:0;width:38%;height:30%;background:#D6E6EE;border-top-right-radius:60px"></div>
<div style="position:absolute;left:50%;top:44%;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center">
<div style="background:#C42E62;color:#FFFFFF;font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px;box-shadow:0 10px 24px rgba(196,46,98,0.35);white-space:nowrap">UpWell</div>
<div style="width:14px;height:14px;background:#C42E62;transform:rotate(45deg);margin-top:-8px"></div>
</div>
<span class="mono" style="position:absolute;right:14px;bottom:12px;font-size:10px;color:#8A7F7C">[Map placeholder]</span>
</div>
<div style="padding:24px 28px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;gap:12px;align-items:flex-start"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C42E62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><div><div style="font-weight:700;font-size:16px">UpWell HQ</div><div style="font-size:14px;color:#5B5150;margin-top:3px">[Street, building], [Area], Lebanon</div></div></div>
<div style="display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:#5B5150"><span><b style="color:#1C1414">Hours</b> [Opening hours]</span><span><b style="color:#1C1414">WhatsApp</b> [+961 number]</span></div>
<a href="#" style="font-weight:700;font-size:15px;color:#C42E62">Open in Google Maps →</a>
</div>
</div>
</div>
</sc-if>
<sc-if value="{{isAmb}}" hint-placeholder-val="{{true}}">
<div style="display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start">
<div style="flex:1 1 380px;min-width:0;border-radius:30px;overflow:hidden;position:relative;min-height:620px;background:#1C1414">
<img src="/assets/43aad4fb3324dd2647a7d6d79d848a6a.webp" alt="Runner drinking Raspberry Protein+" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:45% 35%">
<div style="position:absolute;inset:0;background:linear-gradient(rgba(28,20,20,0) 35%,rgba(28,20,20,0.88) 75%)"></div>
<div style="position:absolute;left:0;right:0;bottom:0;padding:30px;color:#FFFFFF">
<div class="mono" style="font-size:12px;color:#E9849F;margin-bottom:12px">UpWell ambassadors</div>
<div class="disp" style="font-size:48px;margin-bottom:16px">Move with us.</div>
<div style="display:flex;flex-direction:column;gap:10px"><sc-for list="{{perks}}" as="pk" hint-placeholder-count="4"><div style="display:flex;gap:10px;font-size:15px;line-height:1.4"><span style="width:22px;height:22px;border-radius:50%;background:#C42E62;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:12px;font-weight:700">✓</span><span>{{pk}}</span></div></sc-for></div>
<div style="font-size:11px;color:#BDB2AF;margin-top:12px">[Perks to be confirmed]</div>
</div>
</div>
<div style="flex:1.3 1 480px;min-width:0;background:#FFFFFF;border:1px solid #EAE2D6;border-radius:30px;padding:36px" class="m-pad">
<sc-if value="{{ambSent}}" hint-placeholder-val="{{false}}">
<div style="text-align:center;padding:60px 10px">
<div style="width:72px;height:72px;border-radius:50%;background:#C42E62;margin:0 auto 20px;display:flex;align-items:center;justify-content:center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L19 7"/></svg></div>
<div class="disp" style="font-size:42px;margin-bottom:10px">Application sent</div>
<p style="font-size:16px;color:#5B5150;margin:0 0 22px">Thanks for wanting to move with UpWell. Our team reviews every application and gets back to you on WhatsApp.</p>
<button class="b" type="button" onClick="{{resetAmb}}" style="font-weight:700;color:#C42E62;min-height:44px">Send another application</button>
</div>
</sc-if>
<sc-if value="{{ambForm}}" hint-placeholder-val="{{true}}">
<h2 class="disp" style="font-size:42px;margin:0 0 6px">Become an UpWell ambassador</h2>
<p style="font-size:16px;color:#5B5150;margin:0 0 24px">Tell us about you and your community.</p>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 16px">
<div><label class="lbl" for="a-name">Full name</label><input id="a-name" class="field" type="text" autocomplete="name"></div>
<div><label class="lbl" for="a-phone">Phone (WhatsApp)</label><input id="a-phone" class="field" type="tel" placeholder="+961 70 000 000"></div>
<div><label class="lbl" for="a-email">Email</label><input id="a-email" class="field" type="email" autocomplete="email"></div>
<div><label class="lbl" for="a-city">City</label><input id="a-city" class="field" type="text" placeholder="e.g. Beirut"></div>
<div><label class="lbl" for="a-ig">Instagram</label><input id="a-ig" class="field" type="text" placeholder="@yourhandle"></div>
<div><label class="lbl" for="a-tt">TikTok</label><input id="a-tt" class="field" type="text" placeholder="@yourhandle"></div>
<div style="grid-column:1 / -1"><label class="lbl" for="a-other">Other links <span style="font-weight:500;color:#8A7F7C">(YouTube, Strava, club page…)</span></label><input id="a-other" class="field" type="text"></div>
<div style="grid-column:1 / -1"><label class="lbl" for="a-why">Why you? What would you do as an UpWell ambassador?</label><textarea id="a-why" class="field" rows="5" placeholder="Your sport, your community, the content you'd create…" style="resize:vertical"></textarea></div>
</div>
<label style="display:flex;gap:10px;align-items:flex-start;font-size:14px;color:#5B5150;margin:16px 0 20px"><input type="checkbox" style="width:20px;height:20px;margin:0;accent-color:#C42E62;flex:0 0 auto"> I agree to be contacted by UpWell about the ambassador programme.</label>
<button class="b pill" type="button" onClick="{{sendAmb}}" style="width:100%;background:#C42E62;color:#FFFFFF;font-weight:700;font-size:17px;padding:19px;border-radius:999px">Apply to become an UpWell ambassador →</button>
</sc-if>
</div>
</div>
</sc-if>
<sc-if value="{{isCons}}" hint-placeholder-val="{{false}}">
<div style="display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start">
<div style="flex:1.3 1 480px;min-width:0;background:#FFFFFF;border:1px solid #EAE2D6;border-radius:30px;padding:36px">
<sc-if value="{{consSent}}" hint-placeholder-val="{{false}}">
<div style="text-align:center;padding:50px 10px"><div class="disp" style="font-size:42px;margin-bottom:10px">Message sent</div><p style="font-size:16px;color:#5B5150;margin:0 0 20px">Thanks! We'll get back to you within a working day.</p><button class="b" type="button" onClick="{{resetCons}}" style="font-weight:700;color:#C42E62;min-height:44px">Send another message</button></div>
</sc-if>
<sc-if value="{{consForm}}" hint-placeholder-val="{{true}}">
<h2 class="disp" style="font-size:42px;margin:0 0 6px">Send us a message</h2>
<p style="font-size:16px;color:#5B5150;margin:0 0 24px">Questions about a drink, your box or a delivery? We're here.</p>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 16px">
<div><label class="lbl" for="c-name">Name</label><input id="c-name" class="field" type="text" autocomplete="name"></div>
<div><label class="lbl" for="c-phone">Phone or email</label><input id="c-phone" class="field" type="text"></div>
<div style="grid-column:1 / -1"><label class="lbl" for="c-topic">Topic</label><select id="c-topic" class="field"><option>A question about a drink</option><option>My box or subscription</option><option>A delivery</option><option>Something else</option></select></div>
<div style="grid-column:1 / -1"><label class="lbl" for="c-msg">Message</label><textarea id="c-msg" class="field" rows="6" style="resize:vertical"></textarea></div>
</div>
<button class="b pill" type="button" onClick="{{sendCons}}" style="width:100%;margin-top:20px;background:#1C1414;color:#FFFFFF;font-weight:700;font-size:17px;padding:19px;border-radius:999px">Send message</button>
</sc-if>
</div>
