<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="UpWell — functional drinks with a smart cap. Design preview.">
<meta name="theme-color" content="#C42E62">
<title>UpWell — Our drinks</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
body{margin:0;background:#FBF7F0}
a{color:#1C1414}a:hover{color:#C42E62}
.wrap{max-width:1280px;margin:0 auto;padding:0 28px}
.disp{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:0.005em;line-height:0.95}
.mono{font-family:'IBM Plex Mono',monospace;font-weight:600;text-transform:uppercase;letter-spacing:0.04em}
.nav-links{display:flex;gap:34px}
.b{font:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
.pill{transition:transform .2s ease,box-shadow .2s ease}
.pill:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(196,46,98,0.28)}
.lift{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.lift:hover{transform:translateY(-8px);box-shadow:0 24px 50px rgba(28,20,20,0.14)}
.zoom img{transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.zoom:hover img{transform:scale(1.06)}
.fade-up{animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.22s}.d3{animation-delay:.34s}.d4{animation-delay:.46s}
.float{animation:floaty 5s ease-in-out infinite}
.marquee{display:flex;width:max-content;animation:marquee 38s linear infinite}
.track{scroll-snap-type:x mandatory;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.snap{scroll-snap-align:start}
.wob{animation:wobble .7s ease-in-out infinite}
.ripple{animation:ripple 1.1s ease-out infinite}
.spin{animation:spin 2.2s linear infinite}
.glow{animation:glow 2.4s ease-in-out infinite}
.fc{perspective:1400px;height:560px}
.fc-in{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.fc:hover .fc-in,.fc-in.on{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:30px;overflow:hidden;display:flex;flex-direction:column}
.fc-back{transform:rotateY(180deg)}
.fc-bottle{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.fc:hover .fc-bottle{transform:translateY(-10px) rotate(-3deg)}
.stage-img{transition:opacity .8s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.bgfade{transition:background-color .9s ease}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(4deg)}}
@keyframes ripple{from{transform:scale(.4);opacity:.9}to{transform:scale(2.4);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.95;transform:scale(1.1)}}
@keyframes prog{from{width:0}to{width:100%}}
.prog{animation:prog 6s linear both}
.gal{display:flex;gap:16px;width:max-content;animation:marquee 70s linear infinite}
.gal:hover{animation-play-state:paused}
.mo{transition:background-color .35s,border-color .35s,transform .35s}
.mo:hover{transform:translateX(6px)}
.scene{transition:opacity 1.1s ease}
.scene img{transition:transform 6s ease-out}
.deck{transition:transform 1s cubic-bezier(.2,.7,.2,1),opacity .9s ease,box-shadow .9s}
.kb{transform:scale(1.02)}
.kb.on{animation:kb 6s ease-out both}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1.02)}}
.kw{animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){.kb.on,.kw{animation:none}.float,.marquee,.gal,.wob,.ripple,.spin,.glow,.fade-up,.prog{animation:none}}
@media (max-width:820px){.nav-links{display:none}.h1{font-size:62px !important}.hero-img{min-height:440px !important}}
.mnav{display:none}
.mnav>summary{list-style:none;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.mnav>summary::-webkit-details-marker{display:none}
.mnav-panel{position:fixed;left:0;right:0;top:78px;background:#FFFFFF;border-bottom:1px solid #EFE7DB;box-shadow:0 24px 40px rgba(28,20,20,0.14);padding:6px 20px 20px;display:flex;flex-direction:column;z-index:40}
.mnav-panel a{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:26px;line-height:1;color:#1C1414;text-decoration:none;padding:16px 0;border-bottom:1px solid #F0E9DF}
.mnav-panel a.mnav-cta{margin-top:14px;border:none;background:#C42E62;color:#FFFFFF;text-align:center;border-radius:999px;font-family:'Archivo',sans-serif;text-transform:none;font-weight:700;font-size:17px;padding:16px}
@media (max-width:820px){
.nav-links{display:none !important}
.mnav{display:block}
.signin-label{display:none}
.wrap{padding-left:18px !important;padding-right:18px !important}
h1.disp,h2.disp{font-size:clamp(34px,11vw,52px) !important}
h1.disp.m-hero-title{font-size:26px !important}
.m-kw{font-size:84px !important}
.m-title{font-size:32px !important;white-space:normal !important}
.m-deck{margin-right:26px !important;height:auto !important;width:76% !important;min-height:0 !important}
.m-chip{left:-10px !important;bottom:14px !important;max-width:230px !important}
.m-tabs{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
.m-pad{padding:26px !important}
}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="font-family:'Archivo',sans-serif;color:#1C1414;background:#FBF7F0;min-height:100vh">
<header style="position:sticky;top:0;z-index:20;background:rgba(255,255,255,0.97);backdrop-filter:blur(12px);border-bottom:1px solid #EFE7DB">
<div class="wrap" style="display:flex;align-items:center;justify-content:space-between;height:78px;gap:20px">
<div style="display:flex;align-items:center;gap:44px">
<a href="/" aria-label="UpWell home" style="display:flex;align-items:center;min-height:44px"><img src="/assets/31123edbeba1cd87a31fcf992a67861d.png" alt="UpWell" style="height:30px;width:auto;display:block"></a>

<a href="/drinks" style="text-decoration:none;font-weight:600;font-size:17px;color:#C42E62">Our drinks</a>
<a href="/#why" style="text-decoration:none;font-weight:500;font-size:17px;">Why UpWell</a>
<a href="/box" style="text-decoration:none;font-weight:500;font-size:17px;">Build your box</a>
<a href="/#ingredients" style="text-decoration:none;font-weight:500;font-size:17px;">Ingredients</a>
<a href="/contact" style="text-decoration:none;font-weight:500;font-size:17px;">Contact</a>
</nav>
</div>
<div style="display:flex;align-items:center;gap:10px">
<a href="/cart" aria-label="Cart" style="display:flex;width:44px;height:44px;align-items:center;justify-content:center"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#1C1414" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></svg></a>
<a href="#" aria-label="Sign in" style="display:flex;align-items:center;gap:8px;min-height:44px;text-decoration:none;font-weight:500;font-size:16px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C1414" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg><span class="signin-label">Sign in</span></a>
<details class="mnav"><summary aria-label="Menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C1414" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></summary><nav class="mnav-panel" aria-label="Mobile"><a href="/drinks">Our drinks</a><a href="/#why">Why UpWell</a><a href="/box">Build your box</a><a href="/#ingredients">Ingredients</a><a href="/contact">Contact</a><a href="/box" class="mnav-cta">Build your box →</a></nav></details>
</div>
</div>
</header>

<section style="padding:64px 0 36px">
<div class="wrap" style="display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap">
<div>
<div class="mono" style="font-size:12px;color:#C42E62;margin-bottom:14px">Our drinks</div>
<h1 class="disp" style="font-size:min(84px, 6.2vw);margin:0">One for every moment.</h1>
</div>
<p style="font-size:18px;line-height:1.55;color:#5B5150;max-width:440px;margin:0">Four functional drinks, each built around a moment of your day. Real ingredients sealed in the cap, freshly mixed when you twist.</p>
</div>
</section>

<section style="padding:0 0 40px">
<div class="wrap" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(520px,100%),1fr));gap:24px">
<sc-for list="{{drinks}}" as="d" hint-placeholder-count="4">
<a href="/product" class="lift" style="text-decoration:none;color:#1C1414;background:#FFFFFF;border:1px solid #EAE2D6;border-radius:32px;overflow:hidden;display:flex;flex-wrap:wrap">
<div class="zoom" style="flex:1 1 230px;min-height:340px;background:{{d.bg}};position:relative;overflow:hidden"><img src="{{d.img}}" alt="{{d.name}}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%"></div>
<div style="flex:1 1 260px;min-width:0;padding:28px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><span class="disp" style="font-size:30px;color:{{d.color}}">{{d.key}}</span><span class="mono" style="font-size:11px;color:#8A7F7C">{{d.label}}</span></div>
<div class="disp" style="font-size:34px">{{d.name}}</div>
<p style="font-size:15px;line-height:1.5;color:#5B5150;margin:0">{{d.line}}</p>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px"><sc-for list="{{d.facts}}" as="f" hint-placeholder-count="3"><span style="background:{{d.tint}};border-radius:999px;padding:7px 11px;font-weight:700;font-size:12px">{{f}}</span></sc-for></div>
<span style="margin-top:auto;padding-top:14px;font-weight:700;font-size:15px;color:{{d.color}}">See product details →</span>
</div>
</a>
</sc-for>
</div>
</section>

<section style="padding:0 0 72px">
<div class="wrap">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:24px">
<div style="border:2px dashed #D8CEBF;border-radius:32px;padding:32px;display:flex;align-items:center;gap:24px;min-height:150px">
<div style="width:86px;height:120px;border-radius:22px;background:#F3ECE1;display:flex;align-items:center;justify-content:center;flex:0 0 auto"><span class="disp" style="font-size:40px;color:#D8CEBF">?</span></div>
<div><div class="mono" style="font-size:11px;color:#C42E62">Coming soon</div><div class="disp" style="font-size:30px;margin-top:8px">New drink</div><div style="font-size:14px;color:#5B5150;margin-top:6px">[Product name and moment to be confirmed]</div></div>
</div>
<div style="border:2px dashed #D8CEBF;border-radius:32px;padding:32px;display:flex;align-items:center;gap:24px;min-height:150px">
<div style="width:86px;height:120px;border-radius:22px;background:#F3ECE1;display:flex;align-items:center;justify-content:center;flex:0 0 auto"><span class="disp" style="font-size:40px;color:#D8CEBF">?</span></div>
<div><div class="mono" style="font-size:11px;color:#C42E62">Coming soon</div><div class="disp" style="font-size:30px;margin-top:8px">New drink</div><div style="font-size:14px;color:#5B5150;margin-top:6px">[Product name and moment to be confirmed]</div></div>
</div>
</div>
</div>
</section>

<section style="padding:80px 0;background:#FFFFFF">
<div class="wrap">
<h2 style="font-size:46px;font-weight:500;letter-spacing:-0.02em;margin:0 0 28px">Side by side</h2>
<div style="overflow-x:auto;border:1px solid #EAE2D6;border-radius:24px">
<div role="table" aria-label="Drinks compared" style="min-width:820px">
<div role="row" style="display:grid;grid-template-columns:170px repeat(4,minmax(0,1fr));background:#FBF7F0">
<div role="columnheader" style="padding:18px 20px"></div>
<sc-for list="{{drinks}}" as="d" hint-placeholder-count="4"><div role="columnheader" style="padding:16px 20px;display:flex;align-items:center;gap:10px"><img src="{{d.cut}}" alt="" style="height:54px;width:auto"><span><span class="disp" style="display:block;font-size:20px;color:{{d.color}}">{{d.key}}</span><span style="display:block;font-weight:600;font-size:13px">{{d.name}}</span></span></div></sc-for>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5"><div role="row" style="display:grid;grid-template-columns:170px repeat(4,minmax(0,1fr));border-top:1px solid #EFE7DB"><div role="rowheader" style="padding:16px 20px;font-weight:600;color:#5B5150">{{r.label}}</div><sc-for list="{{r.cells}}" as="c" hint-placeholder-count="4"><div role="cell" style="padding:16px 20px;font-weight:600;font-size:15px">{{c}}</div></sc-for></div></sc-for>
</div>
</div>
</div>
</section>

<section style="padding:80px 0">
<div class="wrap">
<div style="background:#C42E62;color:#FFFFFF;border-radius:36px;padding:48px;display:flex;justify-content:space-between;align-items:center;gap:32px;flex-wrap:wrap">
<div><div class="disp" style="font-size:clamp(34px,6vw,54px)">Mix all four in one box.</div><p style="font-size:17px;color:#FFE4EB;margin:12px 0 0;max-width:520px">Pick your box size, fill it with any mix of drinks, subscribe or buy once.</p></div>
<a href="/box" class="pill" style="background:#FFFFFF;color:#C42E62;text-decoration:none;font-weight:700;font-size:17px;padding:19px 34px;border-radius:999px">Build your box →</a>
</div>
</div>
</section>

<footer style="background:#1C1414;color:#BDB2AF;padding:64px 0 32px">
<div class="wrap">
<img src="/assets/da6f4753838cc820e5bdab340ad18692.png" alt="UpWell" style="height:80px;width:auto;max-width:100%;display:block;margin-bottom:44px">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:32px;margin-bottom:44px;font-size:15px">
<div style="display:flex;flex-direction:column;gap:10px"><div style="color:#FBF7F0;font-weight:700">Shop</div><a href="/drinks" style="color:#BDB2AF;text-decoration:none">Our drinks</a><a href="/box" style="color:#BDB2AF;text-decoration:none">Build your box</a><span>Discovery box</span></div>
<div style="display:flex;flex-direction:column;gap:10px"><div style="color:#FBF7F0;font-weight:700">UpWell</div><a href="/#why" style="color:#BDB2AF;text-decoration:none">Why UpWell</a><a href="/#ingredients" style="color:#BDB2AF;text-decoration:none">Ingredients</a><a href="/contact" style="color:#BDB2AF;text-decoration:none">Become an ambassador</a></div>
<div style="display:flex;flex-direction:column;gap:10px"><div style="color:#FBF7F0;font-weight:700">Contact</div><a href="/contact" style="color:#BDB2AF;text-decoration:none">Contact us</a><a href="/contact" style="color:#BDB2AF;text-decoration:none">Distributors &amp; retailers</a><span>WhatsApp us</span></div>
<div style="display:flex;flex-direction:column;gap:10px"><div style="color:#FBF7F0;font-weight:700">Pay with</div><span>Whish</span><span>Cash on delivery</span></div>
</div>
<div style="font-size:12px;border-top:1px solid #3A2E2D;padding-top:22px;line-height:1.6">These statements have not been evaluated by a regulatory authority. UpWell products are not intended to diagnose, treat, cure or prevent any disease. · Twist · Tap · Shake · Enjoy</div>
</div>
</footer>
</div>
</template>
